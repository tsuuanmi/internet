[package]
name = "internet-mcp-task-lifecycle"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
rmcp = { version = "=3.4.0", default-features = false, features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
