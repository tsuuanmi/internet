name: P8 apply

on:
  push:
    branches:
      - impl/p8-local-events

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/p8-apply.py
      - run: npm ci
      - run: npx biome check --write src test scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify-package
      - name: Commit P8 implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: add compact workflow Local events'
          git push
