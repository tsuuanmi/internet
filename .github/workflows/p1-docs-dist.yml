name: P1 docs and dist refresh

on:
  push:
    branches:
      - impl/p1-multi-account-foundation

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 scripts/p1-update-docs.py
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify-package
      - name: Reject stale provider-keyed docs
        shell: bash
        run: |
          if grep -RniE 'maxConcurrentTurnsPerProvider|model: "chatgpt-web"|providers\?:|dataDir/<provider>|accounts/<provider>|chatgpt-web/conversations|gemini-web/conversations|teamSynthesizer.*chatgpt-web' README.md docs/how-it-works.md docs/TODO.md docs/UPDATE.md docs/ADR/0003-multi-account-capability-routing.md; then
            echo 'provider-keyed account docs remain'
            exit 1
          fi
      - name: Commit docs and generated dist
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs dist
          if git diff --cached --quiet; then
            echo 'nothing to refresh'
            exit 0
          fi
          git commit -m 'docs: document account-isolated runtime foundation'
          git push
