name: Provider reconciliation migration

on:
  push:
    branches:
      - docs/workflow-graph-recovery

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 scripts/temp-provider-reconciliation.py
      - run: python3 scripts/temp-provider-reconciliation-fix.py
      - run: npx biome check --write src test scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify-package
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(workflow): reconcile provider turns before retry"
          git push origin HEAD:docs/workflow-graph-recovery
