name: Provider reconciliation migration

on:
  push:
    branches:
      - docs/workflow-graph-recovery

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path("scripts/temp-provider-reconciliation.py")
          text = script.read_text()
          text = text.replace(
              '    if old not in text:\n        raise RuntimeError(f"missing patch anchor in {path}: {old[:80]!r}")\n    file.write_text(text.replace(old, new, 1))',
              '    if old not in text:\n        if new in text:\n            return\n        raise RuntimeError(f"missing patch anchor in {path}: {old[:80]!r}")\n    file.write_text(text.replace(old, new, 1))',
              1,
          )
          script.write_text(text)

          runtime = Path("src/browser/runtime.ts")
          source = runtime.read_text()
          old = '''\t\t\t\t\tpersist: (url) => {
\t\t\t\t\t\ttry {
\t\t\t\t\t\t\treturn this.conversationStore(accountId).bind(request.sessionId, url);
\t\t\t\t\t\t} catch (error) {'''
          new = '''\t\t\t\t\tpersist: (url) => {
\t\t\t\t\t\ttry {
\t\t\t\t\t\t\tconst persisted = this.conversationStore(accountId).bind(request.sessionId, url);
\t\t\t\t\t\t\tif (request.requestKey !== undefined) {
\t\t\t\t\t\t\t\tthis.turnReceiptStore(accountId).bindConversation(
\t\t\t\t\t\t\t\t\trequest.sessionId,
\t\t\t\t\t\t\t\t\trequest.requestKey,
\t\t\t\t\t\t\t\t\tpersisted.conversationUrl,
\t\t\t\t\t\t\t\t);
\t\t\t\t\t\t\t}
\t\t\t\t\t\t\treturn persisted;
\t\t\t\t\t\t} catch (error) {'''
          if old not in source:
              raise RuntimeError("runtime persistence anchor changed")
          runtime.write_text(source.replace(old, new, 1))
          PY
          python3 scripts/temp-provider-reconciliation.py
      - run: npx biome check --write src test scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify-package
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(workflow): reconcile provider turns before retry"
          git push origin HEAD:docs/workflow-graph-recovery
