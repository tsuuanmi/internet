name: Provider reconciliation migration

on:
  push:
    branches:
      - docs/workflow-graph-recovery

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/temp-provider-reconciliation.py")
          text = path.read_text()
          text = text.replace("'''\\t\\t\\t\\tpersist: (url) => {", "'''\\t\\t\\t\\t\\tpersist: (url) => {")
          text = text.replace("\\n\\t\\t\\t\\t\\ttry {\\n\\t\\t\\t\\t\\t\\treturn this.conversationStore(accountId).bind(request.sessionId, url);", "\\n\\t\\t\\t\\t\\t\\ttry {\\n\\t\\t\\t\\t\\t\\t\\treturn this.conversationStore(accountId).bind(request.sessionId, url);")
          text = text.replace("\\n\\t\\t\\t\\t\\t} catch (error) {'''", "\\n\\t\\t\\t\\t\\t\\t} catch (error) {'''")
          text = text.replace("'''\\t\\t\\t\\tpersist: (url) => {", "'''\\t\\t\\t\\t\\tpersist: (url) => {")
          text = text.replace("\\n\\t\\t\\t\\t\\ttry {\\n\\t\\t\\t\\t\\t\\tconst persisted", "\\n\\t\\t\\t\\t\\t\\ttry {\\n\\t\\t\\t\\t\\t\\t\\tconst persisted")
          path.write_text(text)
          PY
          python3 scripts/temp-provider-reconciliation.py
      - run: npx biome check --write src test scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify-package
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(workflow): reconcile provider turns before retry"
          git push origin HEAD:docs/workflow-graph-recovery
