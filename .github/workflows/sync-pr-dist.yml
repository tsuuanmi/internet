name: Sync PR dist

on:
  push:
    branches:
      - feat/provider-agnostic-team-status

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-agnostic-team-status
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated dist and remove helper
        run: |
          rm .github/workflows/sync-pr-dist.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist .github/workflows/sync-pr-dist.yml
          git commit -m "build: sync generated dist"
          git push origin HEAD:feat/provider-agnostic-team-status
