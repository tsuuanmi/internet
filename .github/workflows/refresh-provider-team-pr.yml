name: Refresh provider-team review branch

on:
  push:
    branches:
      - feat/provider-agnostic-team-status

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-agnostic-team-status
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply reviewed workflow hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          # Preserve the reviewed concurrency behavior: two different workflow sessions
          # may use the same authenticated account concurrently, while one session stays ordered.
          replace_once(
              "src/index.ts",
              "The default profile serializes hidden turns per authenticated account to protect portable account state. Different accounts have independent schedulers; workflow lane concurrency must not add an A-then-B mutex above those account-level limits.",
              "The default profile allows up to two hidden turns from different sessions per authenticated account while preserving strict ordering within each session. Different accounts have independent schedulers; workflow lane concurrency must not add an A-then-B mutex above those account-level limits.",
          )
          replace_once(
              "src/index.ts",
              "Research A/B and Review A/B are independent provider-agnostic agent-team lanes and are launched concurrently at the workflow level. Each lane currently uses two independent ChatGPT thinker accounts as Member 1 and Member 2; Gemini is not on the default route. Same-account turns may still serialize through the account scheduler for browser/account safety.",
              "Research A/B and Review A/B are independent provider-agnostic agent-team lanes and are launched concurrently at the workflow level. Each lane currently uses two independent ChatGPT thinker accounts as Member 1 and Member 2; Gemini is not on the default route. The default account scheduler has capacity 2, so Team A and Team B may run different session IDs concurrently on the same account while each session remains strictly ordered.",
          )
          for path, old, new in [
              (
                  "docs/WORKFLOW-HARDENING.md",
                  "Same-account turns may serialize through `maxConcurrentTurnsPerAccount`. That account safety policy is separate from workflow-lane concurrency; workflow adds no A-then-B mutex.",
                  "The default account scheduler capacity is `maxConcurrentTurnsPerAccount = 2`, so Team A and Team B may execute different session IDs concurrently on the same authenticated account. Each native session remains strictly ordered, and work above the configured capacity queues. This account policy is separate from workflow-lane concurrency; workflow adds no A-then-B mutex.",
              ),
              (
                  "docs/WORKFLOW-ENGINE.md",
                  "Same-account Website turns may serialize through the account scheduler according to `maxConcurrentTurnsPerAccount`. That does not change workflow-level lane concurrency.",
                  "The default account scheduler capacity is `maxConcurrentTurnsPerAccount = 2`, so Team A and Team B may execute different session IDs concurrently on the same authenticated account. Each session remains strictly ordered; work above the configured capacity queues. This does not change workflow-level lane independence.",
              ),
              (
                  "docs/TODO.md",
                  "Same-account serialization remains an account-scheduler responsibility; workflow adds no A-then-B mutex.",
                  "Same-session ordering and bounded per-account capacity remain account-scheduler responsibilities; the default capacity is 2 and workflow adds no A-then-B mutex.",
              ),
          ]:
              replace_once(path, old, new)

          # /workflow always pins new jobs to a freshly queried upstream main HEAD,
          # never to the Local worktree HEAD.
          replace_once(
              "src/workflow/repository-context.ts",
              'export class WorkflowRepositoryError extends Error {}\n',
              'export class WorkflowRepositoryError extends Error {}\n\nexport const WORKFLOW_BASE_BRANCH = "main" as const;\n',
          )
          replace_once(
              "src/workflow/repository-context.ts",
              '''\n\tlet revision: string;\n\ttry {\n\t\trevision = cleanOutput(await runGit(cwd, ["rev-parse", "HEAD"], signal));\n\t} catch (error) {\n\t\tif (signal.aborted) throw error;\n\t\tthrow new WorkflowRepositoryError(`${source} could not resolve the current Git revision.`);\n\t}\n\tif (!/^[0-9a-f]{40}$/iu.test(revision))\n\t\tthrow new WorkflowRepositoryError(`${source} could not resolve a valid Git revision.`);\n''',
              "\n",
          )
          replace_once(
              "src/workflow/repository-context.ts",
              '''\treturn { url, revision: revision.toLowerCase() };\n''',
              '''\tconst expectedRef = `refs/heads/${WORKFLOW_BASE_BRANCH}`;\n\tconst remoteHead = await optionalGit(\n\t\trunGit,\n\t\tcwd,\n\t\t["ls-remote", "--exit-code", "--heads", remote, expectedRef],\n\t\tsignal,\n\t);\n\tconst remoteHeadLines = remoteHead\n\t\t?.split(/\\r?\\n/u)\n\t\t.map((line) => line.trim())\n\t\t.filter((line) => line !== "");\n\tif (remoteHeadLines === undefined || remoteHeadLines.length !== 1) {\n\t\tthrow new WorkflowRepositoryError(`${source} could not resolve upstream ${WORKFLOW_BASE_BRANCH} HEAD.`);\n\t}\n\tconst [revision, ref] = remoteHeadLines[0]!.split(/\\s+/u);\n\tif (revision === undefined || ref !== expectedRef || !/^[0-9a-f]{40}$/iu.test(revision)) {\n\t\tthrow new WorkflowRepositoryError(`${source} could not resolve a valid upstream ${WORKFLOW_BASE_BRANCH} HEAD.`);\n\t}\n\treturn { url, revision: revision.toLowerCase() };\n''',
          )

          # Writer authority is explicitly main-based and squash-only at merge.
          replace_once(
              "src/workflow/writer-runner.ts",
              'import type { WorkflowControlMessage } from "#internet/workflow/control";\n',
              'import type { WorkflowControlMessage } from "#internet/workflow/control";\nimport { WORKFLOW_BASE_BRANCH } from "#internet/workflow/repository-context";\n',
          )
          replace_once(
              "src/workflow/writer-runner.ts",
              '\t\t\t`Target repository: ${job.repository}`,\n\t\t\t`Required base revision: ${job.baseRevision}`,\n',
              '\t\t\t`Target repository: ${job.repository}`,\n\t\t\t`Required base branch: ${WORKFLOW_BASE_BRANCH}`,\n\t\t\t`Required base revision: ${job.baseRevision}`,\n',
          )
          replace_once(
              "src/workflow/writer-runner.ts",
              'Verify the target repository and base revision, inspect the current repository, implement the objective without needless redesign, and validate the change.',
              'Verify the target repository, the required upstream base branch, and the exact required base revision. Create or reuse the workflow branch from that exact revision, inspect the repository, implement the objective without needless redesign, validate the change, and target only the required base branch.',
          )
          replace_once(
              "src/workflow/writer-runner.ts",
              '\t\t\t`Required PR head branch: ${pullRequest.head}`,\n\t\t\t`Authorized exact head SHA: ${control.expectedHeadSha}`,\n',
              '\t\t\t`Required PR head branch: ${pullRequest.head}`,\n\t\t\t`Required base branch: ${WORKFLOW_BASE_BRANCH}`,\n\t\t\t`Authorized exact head SHA: ${control.expectedHeadSha}`,\n',
          )
          replace_once(
              "src/workflow/writer-runner.ts",
              'Do not modify files, commits, branch contents, PR metadata, or repository settings. Otherwise merge exactly this one pull request and nothing else.',
              'Do not modify files, commits, branch contents, PR metadata, or repository settings. Otherwise squash-merge exactly this one pull request and nothing else. Squash merge is mandatory so this workflow contributes exactly one commit to the base branch; if squash merge is unavailable, return BLOCKED and never fall back to a merge commit or rebase merge.',
          )

          replace_once(
              "src/workflow/engine.ts",
              'import type { WorkflowReviewResult } from "#internet/workflow/review-result";\n',
              'import type { WorkflowReviewResult } from "#internet/workflow/review-result";\nimport { WORKFLOW_BASE_BRANCH } from "#internet/workflow/repository-context";\n',
          )
          replace_once(
              "src/workflow/engine.ts",
              '''\t\tif (result.status !== "PR_OPEN")\n\t\t\tthrow new WorkflowEngineError("writer returned merge output outside merge phase");\n\t\treturn this.update(jobId, (current) => ({\n''',
              '''\t\tif (result.status !== "PR_OPEN")\n\t\t\tthrow new WorkflowEngineError("writer returned merge output outside merge phase");\n\t\tif (result.pullRequest.base !== WORKFLOW_BASE_BRANCH) {\n\t\t\treturn this.writerBlocked(\n\t\t\t\tjobId,\n\t\t\t\t`writer pull request must target ${WORKFLOW_BASE_BRANCH}`,\n\t\t\t\t"WRITER_RUNNING",\n\t\t\t);\n\t\t}\n\t\treturn this.update(jobId, (current) => ({\n''',
          )

          # Explicit exact-ID workflow deletion. Active jobs are cancelled first;
          # terminal durable artifacts are then removed through the retention owner.
          replace_once(
              "src/workflow/retention.ts",
              'import type { WorkflowJob, WorkflowState } from "#internet/workflow/types";\n',
              'import { TERMINAL_WORKFLOW_STATES, type WorkflowJob, type WorkflowState } from "#internet/workflow/types";\n',
          )
          replace_once(
              "src/workflow/retention.ts",
              '''export class WorkflowRetentionError extends Error {\n''',
              '''export interface WorkflowDeletionReceipt {\n\treadonly jobId: string;\n\treadonly state: WorkflowState;\n\treadonly repository: string;\n\treadonly operatorSessionId: string;\n\treadonly deletedHandoffFiles: number;\n\treadonly deletedTrace: boolean;\n\treadonly deletedAt: string;\n}\n\nexport class WorkflowRetentionError extends Error {\n''',
          )
          marker = '''function assertPrivateRegularFile(path: string, label: string): void {\n\tconst file = lstatSync(path);\n\tif (!file.isFile()) throw new WorkflowRetentionError(`${label} is not a regular file`);\n\tif (process.platform !== "win32" && (file.mode & 0o077) !== 0)\n\t\tthrow new WorkflowRetentionError(`${label} permissions must be 0600`);\n}\n'''
          helper = marker + '''\nfunction deleteWorkflowArtifacts(\n\tjobs: WorkflowJobStore,\n\thandoffRoot: string,\n\ttraceRoot: string,\n\tjob: WorkflowJob,\n): { readonly deletedHandoffFiles: number; readonly deletedTrace: boolean } {\n\tlet deletedHandoffFiles = 0;\n\tconst jobHandoffDir = join(handoffRoot, job.jobId);\n\tif (existsSync(jobHandoffDir)) {\n\t\tconst stat = lstatSync(jobHandoffDir);\n\t\tif (!stat.isDirectory()) throw new WorkflowRetentionError("workflow handoff path is not a directory");\n\t\tconst names = readdirSync(jobHandoffDir).sort();\n\t\tfor (const name of names) {\n\t\t\tif (!/^[0-9a-f]{64}\\.json$/u.test(name))\n\t\t\t\tthrow new WorkflowRetentionError(`unexpected file in workflow handoff directory: ${name}`);\n\t\t\tassertPrivateRegularFile(join(jobHandoffDir, name), `handoff cleanup target ${name}`);\n\t\t}\n\t\tfor (const name of names) {\n\t\t\tunlinkSync(join(jobHandoffDir, name));\n\t\t\tdeletedHandoffFiles += 1;\n\t\t}\n\t\trmdirSync(jobHandoffDir);\n\t}\n\n\tconst tracePath = join(traceRoot, `${job.jobId}.json`);\n\tlet deletedTrace = false;\n\tif (existsSync(tracePath)) {\n\t\tassertPrivateRegularFile(tracePath, "workflow team trace cleanup target");\n\t\tunlinkSync(tracePath);\n\t\tdeletedTrace = true;\n\t}\n\n\tconst jobPath = jobs.pathFor(job.jobId);\n\tassertPrivateRegularFile(jobPath, "workflow cleanup target");\n\tunlinkSync(jobPath);\n\treturn { deletedHandoffFiles, deletedTrace };\n}\n'''
          replace_once("src/workflow/retention.ts", marker, helper)
          replace_once(
              "src/workflow/retention.ts",
              '''\tcleanup(input: { jobId: string; expectedUpdatedAt: string; operatorSessionId: string }): WorkflowCleanupAudit {\n''',
              '''\tdeleteNow(input: { jobId: string; expectedUpdatedAt: string; operatorSessionId: string }): WorkflowDeletionReceipt {\n\t\tif (input.operatorSessionId.trim() === "") throw new WorkflowRetentionError("operator session id is required");\n\t\tif (!Number.isFinite(Date.parse(input.expectedUpdatedAt)))\n\t\t\tthrow new WorkflowRetentionError("expectedUpdatedAt must be an ISO timestamp");\n\t\tconst job = this.jobs.get(input.jobId);\n\t\tif (job === undefined) throw new WorkflowRetentionError(`workflow job ${input.jobId} does not exist`);\n\t\tif (job.updatedAt !== input.expectedUpdatedAt)\n\t\t\tthrow new WorkflowRetentionError("workflow job changed before deletion; refresh before deleting");\n\t\tif (!TERMINAL_WORKFLOW_STATES.has(job.state))\n\t\t\tthrow new WorkflowRetentionError("workflow job must be terminal before deletion");\n\t\tconst deleted = deleteWorkflowArtifacts(this.jobs, this.handoffRoot, this.traceRoot, job);\n\t\treturn {\n\t\t\tjobId: job.jobId,\n\t\t\tstate: job.state,\n\t\t\trepository: job.repository,\n\t\t\toperatorSessionId: input.operatorSessionId,\n\t\t\t...deleted,\n\t\t\tdeletedAt: this.now().toISOString(),\n\t\t};\n\t}\n\n\tcleanup(input: { jobId: string; expectedUpdatedAt: string; operatorSessionId: string }): WorkflowCleanupAudit {\n''',
          )
          retention = read("src/workflow/retention.ts")
          start = retention.index("\t\tlet deletedHandoffFiles = 0;\n\t\ttry {\n\t\t\tconst jobHandoffDir")
          end = retention.index("\t\t\tconst completed: WorkflowCleanupAudit = {", start)
          replacement = '''\t\tlet deletedHandoffFiles = 0;\n\t\ttry {\n\t\t\tconst deleted = deleteWorkflowArtifacts(this.jobs, this.handoffRoot, this.traceRoot, job);\n\t\t\tdeletedHandoffFiles = deleted.deletedHandoffFiles;\n\n'''
          write("src/workflow/retention.ts", retention[:start] + replacement + retention[end:])

          replace_once(
              "src/workflow/operator.ts",
              'import type { WorkflowTeamTraceEvent, WorkflowTeamTraceStore } from "#internet/workflow/team-trace-store";\n',
              'import type { WorkflowRetentionManager } from "#internet/workflow/retention";\nimport type { WorkflowTeamTraceEvent, WorkflowTeamTraceStore } from "#internet/workflow/team-trace-store";\n',
          )
          replace_once(
              "src/workflow/operator.ts",
              '''\tprivate readonly traces: WorkflowTeamTraceStore;\n''',
              '''\tprivate readonly traces: WorkflowTeamTraceStore;\n\tprivate readonly retention: WorkflowRetentionManager;\n''',
          )
          replace_once(
              "src/workflow/operator.ts",
              '''\t\tjobs: WorkflowJobStore,\n\t\ttraces: WorkflowTeamTraceStore,\n\t) {\n''',
              '''\t\tjobs: WorkflowJobStore,\n\t\ttraces: WorkflowTeamTraceStore,\n\t\tretention: WorkflowRetentionManager,\n\t) {\n''',
          )
          replace_once(
              "src/workflow/operator.ts",
              '''\t\tthis.jobs = jobs;\n\t\tthis.traces = traces;\n''',
              '''\t\tthis.jobs = jobs;\n\t\tthis.traces = traces;\n\t\tthis.retention = retention;\n''',
          )
          replace_once(
              "src/workflow/operator.ts",
              '''\tcontinue(ownerSessionId: string, jobId?: string): string {\n''',
              '''\tasync delete(ownerSessionId: string, jobId?: string): Promise<string> {\n\t\tif (jobId === undefined) throw new WorkflowOperatorError("/workflow delete requires an explicit jobId");\n\t\tconst selected = selectJob(this.jobs, ownerSessionId, jobId, false);\n\t\tconst terminal = TERMINAL_WORKFLOW_STATES.has(selected.state) ? selected : await this.driver.cancel(selected.jobId);\n\t\tconst deleted = this.retention.deleteNow({\n\t\t\tjobId: terminal.jobId,\n\t\t\texpectedUpdatedAt: terminal.updatedAt,\n\t\t\toperatorSessionId: ownerSessionId,\n\t\t});\n\t\treturn `Workflow ${deleted.jobId} deleted. Previous state: ${deleted.state}. Removed ${deleted.deletedHandoffFiles} handoff file(s)${deleted.deletedTrace ? " and its team trace" : ""}.`;\n\t}\n\n\tcontinue(ownerSessionId: string, jobId?: string): string {\n''',
          )

          replace_once(
              "src/commands/workflow.ts",
              'const USAGE = "Usage: /workflow <objective> | list | status [jobId] | watch [jobId] | stop [jobId] | continue [jobId]";\nconst OPERATIONS = new Set(["list", "status", "watch", "stop", "continue"]);\n',
              'const USAGE = "Usage: /workflow <objective> | list | status [jobId] | watch [jobId] | stop [jobId] | continue [jobId] | delete <jobId>";\nconst OPERATIONS = new Set(["list", "status", "watch", "stop", "continue", "delete"]);\n',
          )
          replace_once(
              "src/commands/workflow.ts",
              '''\tstop(ownerSessionId: string, jobId?: string): Promise<string>;\n\tcontinue(ownerSessionId: string, jobId?: string): string;\n''',
              '''\tstop(ownerSessionId: string, jobId?: string): Promise<string>;\n\tcontinue(ownerSessionId: string, jobId?: string): string;\n\tdelete(ownerSessionId: string, jobId?: string): Promise<string>;\n''',
          )
          replace_once(
              "src/commands/workflow.ts",
              '''\tif (operation === "list") {\n\t\tif (parts.length !== 1) throw new WorkflowOperatorError("/workflow list does not accept a jobId");\n\t\treturn { operation };\n\t}\n''',
              '''\tif (operation === "list") {\n\t\tif (parts.length !== 1) throw new WorkflowOperatorError("/workflow list does not accept a jobId");\n\t\treturn { operation };\n\t}\n\tif (operation === "delete") {\n\t\tif (parts.length !== 2 || parts[1] === undefined)\n\t\t\tthrow new WorkflowOperatorError("/workflow delete requires exactly one jobId");\n\t\treturn { operation, jobId: parts[1] };\n\t}\n''',
          )
          replace_once(
              "src/commands/workflow.ts",
              '''\t\tinput: { hint: "<objective> | list | status [jobId] | watch [jobId] | stop [jobId] | continue [jobId]" },\n''',
              '''\t\tinput: { hint: "<objective> | list | status [jobId] | watch [jobId] | stop [jobId] | continue [jobId] | delete <jobId>" },\n''',
          )
          replace_once(
              "src/commands/workflow.ts",
              '''\t\t\t\t\tif (parsed.operation === "stop")\n\t\t\t\t\t\treturn { kind: "success", text: await dependencies.operator.stop(ownerSessionId, parsed.jobId) };\n\t\t\t\t\treturn { kind: "success", text: dependencies.operator.continue(ownerSessionId, parsed.jobId) };\n''',
              '''\t\t\t\t\tif (parsed.operation === "stop")\n\t\t\t\t\t\treturn { kind: "success", text: await dependencies.operator.stop(ownerSessionId, parsed.jobId) };\n\t\t\t\t\tif (parsed.operation === "delete")\n\t\t\t\t\t\treturn { kind: "success", text: await dependencies.operator.delete(ownerSessionId, parsed.jobId) };\n\t\t\t\t\treturn { kind: "success", text: dependencies.operator.continue(ownerSessionId, parsed.jobId) };\n''',
          )

          replace_once(
              "src/index.ts",
              'Use /workflow <task> as the normal entry point for a durable coding workflow. Use /workflow list, /workflow status [jobId], /workflow watch [jobId], /workflow stop [jobId], and /workflow continue [jobId] for operator control without reading private JSON files manually.',
              'Use /workflow <task> as the normal entry point for a durable coding workflow. Use /workflow list, /workflow status [jobId], /workflow watch [jobId], /workflow stop [jobId], /workflow continue [jobId], and /workflow delete <jobId> for operator control without reading private JSON files manually. New jobs always pin a freshly queried upstream main HEAD; deletion requires an explicit workflow ID.',
          )
          replace_once(
              "src/index.ts",
              '''\t\tconst workflowEngine = new WorkflowEngine(\n\t\t\tworkflowJobs,\n\t\t\tnew BrowserWorkflowTeamRunner(manager, config, workflowObserver),\n\t\t\tnew WorkflowTeamPromptBuilder(),\n\t\t\tnew WorkflowHandoffStore(config.dataDir),\n''',
              '''\t\tconst workflowHandoffs = new WorkflowHandoffStore(config.dataDir);\n\t\tconst workflowRetention = new WorkflowRetentionManager(config.dataDir, workflowJobs);\n\t\tconst workflowEngine = new WorkflowEngine(\n\t\t\tworkflowJobs,\n\t\t\tnew BrowserWorkflowTeamRunner(manager, config, workflowObserver),\n\t\t\tnew WorkflowTeamPromptBuilder(),\n\t\t\tworkflowHandoffs,\n''',
          )
          replace_once(
              "src/index.ts",
              '''\t\tconst workflowOperator = new WorkflowOperator(workflowEngine, workflowDriver, workflowJobs, workflowTraces);\n''',
              '''\t\tconst workflowOperator = new WorkflowOperator(\n\t\t\tworkflowEngine,\n\t\t\tworkflowDriver,\n\t\t\tworkflowJobs,\n\t\t\tworkflowTraces,\n\t\t\tworkflowRetention,\n\t\t);\n''',
          )
          replace_once(
              "src/index.ts",
              '''\t\tctx.tools.register(\n\t\t\tdefineInternetWorkflowMaintenanceTool(new WorkflowRetentionManager(config.dataDir, workflowJobs)),\n\t\t);\n''',
              '''\t\tctx.tools.register(defineInternetWorkflowMaintenanceTool(workflowRetention));\n''',
          )

          # Package isolation expectation: disabling Gemini no longer disables the
          # two-ChatGPT team/workflow route.
          replace_once(
              "scripts/verify-package.mjs",
              '''\t\t{\n\t\t\tconfig: { enableGemini: false },\n\t\t\ttools: ["internet_browser", "internet_chat", "internet_research"],\n\t\t\tcommands: ["internet"],\n\t\t\tsections: ["tool:internet_research", "tool:internet_chat"],\n\t\t},\n''',
              '''\t\t{\n\t\t\tconfig: { enableGemini: false },\n\t\t\ttools: [\n\t\t\t\t"internet_browser",\n\t\t\t\t"internet_chat",\n\t\t\t\t"internet_research",\n\t\t\t\t"internet_team",\n\t\t\t\t"internet_workflow",\n\t\t\t\t"internet_workflow_maintenance",\n\t\t\t],\n\t\t\tcommands: ["internet", "workflow"],\n\t\t\tsections: ["tool:internet_research", "tool:internet_chat", "tool:internet_team", "tool:internet_workflow"],\n\t\t},\n''',
          )

          # Command tests now prove the upstream main pin and exact-ID deletion surface.
          replace_once(
              "test/commands/workflow.test.ts",
              '''\t\t"rev-parse HEAD": `${REVISION}\\n`,\n''',
              '''\t\t"rev-parse HEAD": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\\n",\n\t\t"ls-remote --exit-code --heads origin refs/heads/main": `${REVISION}\\trefs/heads/main\\n`,\n''',
          )
          replace_once(
              "test/commands/workflow.test.ts",
              '''\tdelete(ownerSessionId: string, jobId?: string): Promise<string>;\n''',
              '''\tdelete(ownerSessionId: string, jobId?: string): Promise<string>;\n''',
          ) if False else None
          replace_once(
              "test/commands/workflow.test.ts",
              '''\tcontinue: ReturnType<typeof vi.fn>;\n} {\n''',
              '''\tcontinue: ReturnType<typeof vi.fn>;\n\tdelete: ReturnType<typeof vi.fn>;\n} {\n''',
          )
          replace_once(
              "test/commands/workflow.test.ts",
              '''\t\tcontinue: vi.fn(() => "CONTINUED"),\n''',
              '''\t\tcontinue: vi.fn(() => "CONTINUED"),\n\t\tdelete: vi.fn(async () => "DELETED"),\n''',
          )
          replace_once(
              "test/commands/workflow.test.ts",
              '''\t\texpect(runGit).toHaveBeenCalledWith("/repo", ["rev-parse", "--show-toplevel"], input.signal);\n''',
              '''\t\texpect(runGit).toHaveBeenCalledWith("/repo", ["rev-parse", "--show-toplevel"], input.signal);\n\t\texpect(runGit).toHaveBeenCalledWith(\n\t\t\t"/repo",\n\t\t\t["ls-remote", "--exit-code", "--heads", "origin", "refs/heads/main"],\n\t\t\tinput.signal,\n\t\t);\n\t\texpect(runGit).not.toHaveBeenCalledWith("/repo", ["rev-parse", "HEAD"], input.signal);\n''',
          )
          replace_once(
              "test/commands/workflow.test.ts",
              '''\t\t\t[`continue ${JOB_ID}`, "CONTINUED"],\n''',
              '''\t\t\t[`continue ${JOB_ID}`, "CONTINUED"],\n\t\t\t[`delete ${JOB_ID}`, "DELETED"],\n''',
          )
          replace_once(
              "test/commands/workflow.test.ts",
              '''\t\texpect(op.continue).toHaveBeenCalledWith("1-1", JOB_ID);\n''',
              '''\t\texpect(op.continue).toHaveBeenCalledWith("1-1", JOB_ID);\n\t\texpect(op.delete).toHaveBeenCalledWith("1-1", JOB_ID);\n''',
          )
          replace_once(
              "test/commands/workflow.test.ts",
              '''\t\tawait expect(command.handler(invocation("status one two") as never)).resolves.toMatchObject({\n\t\t\tkind: "error",\n\t\t\ttext: expect.stringContaining("at most one jobId"),\n\t\t});\n''',
              '''\t\tawait expect(command.handler(invocation("status one two") as never)).resolves.toMatchObject({\n\t\t\tkind: "error",\n\t\t\ttext: expect.stringContaining("at most one jobId"),\n\t\t});\n\t\tawait expect(command.handler(invocation("delete") as never)).resolves.toMatchObject({\n\t\t\tkind: "error",\n\t\t\ttext: expect.stringContaining("requires exactly one jobId"),\n\t\t});\n''',
