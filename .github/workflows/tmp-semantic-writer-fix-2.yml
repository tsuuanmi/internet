name: Temporary semantic writer fix builder 2

on:
  push:
    branches:
      - fix/chatgpt-semantic-writer-response

permissions:
  contents: write

jobs:
  apply-format-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chatgpt-semantic-writer-response
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reuse staged transformation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/tmp-semantic-writer-fix.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n\n      - run: npm ci"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<semantic-writer-transform>', 'exec'), {'__name__': '__main__'})
          PY

      - run: npm ci
      - run: npx biome check --write src test scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify-package

      - name: Commit source, tests, and generated dist
        shell: bash
        run: |
          git rm .github/workflows/tmp-semantic-writer-fix.yml .github/workflows/tmp-semantic-writer-fix-2.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve semantic writer responses"
          git push origin HEAD:fix/chatgpt-semantic-writer-response
