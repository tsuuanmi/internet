name: Phase0 Update Dist

on:
  push:
    branches:
      - workflow/phase0-service-boundary
    paths:
      - .github/workflows/phase0-update-dist.yml

permissions:
  contents: write

jobs:
  update-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow/phase0-service-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated dist
        run: |
          if git diff --quiet -- dist; then
            echo "dist already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "build: update phase0 dist artifacts"
          git push origin HEAD:workflow/phase0-service-boundary
