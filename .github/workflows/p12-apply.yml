name: P12 Apply

on:
  push:
    branches:
      - impl/p12-ci-pr-health-gate

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/p12-ci-pr-health-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/p12-apply.py
      - run: npx biome check --write src test scripts
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist
      - run: npm run verify-package
      - name: Commit P12 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test docs dist
          git commit -m "feat: add exact-head PR health merge gate"
          git push
