name: Phase1 Repair Engine

on:
  push:
    branches:
      - workflow/phase1-durable-admission
    paths:
      - .github/workflows/phase1-repair-engine.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow/phase1-durable-admission
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore current main engine and apply minimal deterministic id patch
        run: |
          git fetch origin main
          git checkout origin/main -- src/workflow/engine.ts
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/workflow/engine.ts';
          let text = fs.readFileSync(path, 'utf8');
          const before = 'const jobId = randomBytes(16).toString("hex");';
          const after = 'if (input.jobId !== undefined && !/^[0-9a-f]{32}$/u.test(input.jobId))\n\t\t\tthrow new Error("workflow job id must be 32 lowercase hex characters");\n\t\tconst jobId = input.jobId ?? randomBytes(16).toString("hex");';
          if (!text.includes(before)) throw new Error('expected WorkflowEngine job id line not found on main');
          text = text.replace(before, after);
          fs.writeFileSync(path, text);
          NODE
          npx biome check --write src/workflow/engine.ts src/workflow/service.ts test/workflow-admission-recovery.test.ts
      - name: Commit repaired engine patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/workflow/engine.ts src/workflow/service.ts test/workflow-admission-recovery.test.ts
          git commit -m "fix: preserve current engine while binding admission ids"
          git push origin HEAD:workflow/phase1-durable-admission
