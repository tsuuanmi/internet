name: P1 runtime refactor

on:
  push:
    branches:
      - impl/p1-multi-account-foundation

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 scripts/p1-runtime-fix.py
      - run: npx biome check --write src/browser/runtime.ts
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/browser/runtime.ts
          if git diff --cached --quiet; then
            echo 'no changes'
            exit 0
          fi
          git commit -m 'fix: complete account-aware browser lifecycle'
          git push
