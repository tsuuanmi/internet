name: Phase2 Dist Refresh

on:
  push:
    branches:
      - workflow/phase2-kernel-substrate

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow/phase2-kernel-substrate
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify-package
      - name: Commit generated dist and remove helper
        run: |
          rm .github/workflows/phase2-dist-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: refresh Phase 2 kernel dist'
          git push origin HEAD:workflow/phase2-kernel-substrate
