name: Sync P0 docs

on:
  push:
    branches:
      - impl/p0-chatgpt-high

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update current-state documentation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function edit(path, fn) {
            const before = fs.readFileSync(path, 'utf8');
            const after = fn(before);
            if (after === before) throw new Error(`No documentation change produced for ${path}`);
            fs.writeFileSync(path, after);
          }

          function mustReplace(text, search, replacement, label) {
            if (!text.includes(search)) throw new Error(`Missing expected text: ${label}`);
            return text.replace(search, replacement);
          }

          edit('README.md', (text) => {
            text = mustReplace(text, '`medium` as the default', '`high` as the default', 'README High default');
            text = mustReplace(text, 'chatgptThinkingLevel: medium', 'chatgptThinkingLevel: high', 'README config example');
            text = mustReplace(text, '      teamMaxRounds: 4\n', '      teamMaxRounds: 4\n      teamSynthesizer: chatgpt-web\n', 'README synthesizer example');
            text = mustReplace(text, '| `teamSynthesis` | `true` | Append a final synthesis turn by default. |\n', '| `teamSynthesis` | `true` | Append a final synthesis turn by default. |\n| `teamSynthesizer` | `chatgpt-web` | Provider that performs final team synthesis, independent of speaking order. |\n', 'README synthesizer table');
            text = mustReplace(text, '| `chatgptThinkingLevel` | `medium` | ChatGPT reasoning level: `instant`, `medium`, or `high`. |', '| `chatgptThinkingLevel` | `high` | ChatGPT reasoning level: `instant`, `medium`, or `high`. |', 'README default table');
            const synthesis = /When synthesis is enabled, the final provider receives the\s+full current-call transcript and produces the final answer\./;
            if (!synthesis.test(text)) throw new Error('Missing README synthesis description');
            text = text.replace(synthesis, 'When synthesis is enabled, the configured `teamSynthesizer` receives the full current-call transcript and produces the final answer. ChatGPT (`chatgpt-web`) is the default synthesizer, independent of speaking order.');
            return text;
          });

          edit('docs/how-it-works.md', (text) => {
            text = mustReplace(text, 'The default is `medium`', 'The default is `high`', 'how-it-works High default');
            const synthesis = /When synthesis is enabled, the last provider receives the full current-call debate transcript and returns\s+a single final answer\./;
            if (!synthesis.test(text)) throw new Error('Missing how-it-works synthesis description');
            text = text.replace(synthesis, 'When synthesis is enabled, the configured `teamSynthesizer` receives the full current-call debate transcript and returns a single final answer. The default synthesizer is `chatgpt-web`, independent of provider speaking order.');
            return text;
          });

          edit('docs/internet-team-architecture.md', (text) => {
            text = mustReplace(text, '- The current team orchestrator synthesizes with the last provider; target behavior is explicit ChatGPT synthesis.\n- The current ChatGPT thinking default is Medium; target behavior is High.', '- The team orchestrator now routes synthesis through an explicit configured provider; ChatGPT is the default.\n- Ordinary ChatGPT browser turns now default to High reasoning unless explicitly overridden.', 'architecture implemented P0 facts');
            return text;
          });

          edit('docs/UPDATE.md', (text) => {
            text = mustReplace(text, '- ChatGPT thinker is the explicit default team synthesizer;\n- ChatGPT browser default should become `high`;', '- team synthesis is explicitly routed through a configured provider; ChatGPT is the default synthesizer;\n- ChatGPT browser default is `high`;', 'UPDATE P0 status');
            return text;
          });

          edit('docs/TODO.md', (text) => {
            text = mustReplace(text, '### 1. Default ChatGPT browser reasoning to High\n', '### 1. ✅ Default ChatGPT browser reasoning to High\n\n**Status:** implemented.\n', 'TODO item 1');
            text = mustReplace(text, '### 2. Make the team synthesizer explicit and default to ChatGPT thinker\n', '### 2. ✅ Make the team synthesizer explicit and default to ChatGPT thinker\n\n**Status:** implemented at provider level; migrate the synthesizer identity to `accountId` during the multi-account phase.\n', 'TODO item 2');
            return text;
          });
          NODE
      - name: Commit documentation sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/how-it-works.md docs/internet-team-architecture.md docs/UPDATE.md docs/TODO.md
          git commit -m 'docs: sync P0 runtime behavior'
          git push
