name: Verify

on:
  push:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply login reliability patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Give manual multi-account login enough time.
          path = Path("src/core/config.ts")
          text = path.read_text()
          old = '\t/** Max time to wait for an interactive login to reach the authenticated surface (ms). */'
          new = '\t/** Max time to keep one manual noVNC login session open before it expires (ms). */'
          assert old in text
          text = text.replace(old, new)
          assert '\tloginTimeoutMs: 180_000,' in text
          text = text.replace('\tloginTimeoutMs: 180_000,', '\tloginTimeoutMs: 1_800_000,')
          path.write_text(text)

          # 2) Recognize current ChatGPT profile controls and tolerate duplicate visible composer surfaces.
          path = Path("src/browser/chatgpt.ts")
          text = path.read_text()
          old = 'export const CHATGPT_ACCOUNT_SELECTOR = \'[data-testid="accounts-profile-button"]\';'
          new = '''export const CHATGPT_ACCOUNT_SELECTOR = [
          \t'[data-testid="accounts-profile-button"]',
          \t'[data-testid="profile-button"]',
          \t'[data-testid="user-menu-button"]',
          \t'button[aria-label*="profile" i]',
          \t'button[aria-label*="account" i]',
          ].join(", ");'''
          assert old in text
          text = text.replace(old, new)
          old = 'return (await composers.count()) === 1 && (await accounts.count()) > 0;'
          assert old in text
          text = text.replace(old, 'return (await composers.count()) > 0 && (await accounts.count()) > 0;')
          path.write_text(text)

          # 3) Save only after Chrome has exited cleanly; allow Chrome more time to flush the profile.
          path = Path("src/browser/remote-login.ts")
          text = path.read_text()
          old = 'const SHUTDOWN_TIMEOUT_MS = 2_000;'
          assert old in text
          text = text.replace(old, 'const VNC_SHUTDOWN_TIMEOUT_MS = 2_000;\nconst CHROME_SHUTDOWN_TIMEOUT_MS = 10_000;')
          old = '''\tprivate async finalizeAccount(): Promise<void> {
          \t\tconst accountFinalization = this.options.finalize().then(
          \t\t\t() => ({ ok: true as const }),
          \t\t\t(error: unknown) => ({ ok: false as const, error }),
          \t\t);
          \t\ttry {
          \t\t\tawait this.closeDesktop();
          \t\t\tconst result = await accountFinalization;
          \t\t\tif (!result.ok) throw result.error;
          \t\t\tthis.state = "complete";
          \t\t\tthis.message = `${this.options.provider} account saved successfully.`;
          \t\t} catch (error) {
          \t\t\tawait accountFinalization;
          \t\t\tthis.state = "failed";
          \t\t\tthis.message = error instanceof Error ? error.message : "Remote login finalization failed.";
          \t\t} finally {
          \t\t\tthis.clearTimeout();
          \t\t\tthis.scheduleClose();
          \t\t}
          \t}'''
          new = '''\tprivate async finalizeAccount(): Promise<void> {
          \t\ttry {
          \t\t\t// Chrome owns the profile while the user signs in. Let it exit cleanly
          \t\t\t// and flush cookies/storage before Patchright reopens the profile.
          \t\t\tawait this.closeDesktop();
          \t\t\tawait this.options.finalize();
          \t\t\tthis.state = "complete";
          \t\t\tthis.message = `${this.options.provider} account saved successfully.`;
          \t\t} catch (error) {
          \t\t\tthis.state = "failed";
          \t\t\tthis.message = error instanceof Error ? error.message : "Remote login finalization failed.";
          \t\t} finally {
          \t\t\tthis.clearTimeout();
          \t\t\tthis.scheduleClose();
          \t\t}
          \t}'''
          assert old in text
          text = text.replace(old, new)
          text = text.replace('await this.terminate(child);', 'await this.terminate(child, VNC_SHUTDOWN_TIMEOUT_MS);')
          old = '''\t\tawait this.terminate(this.chrome);
          \t\tawait this.terminate(this.vnc);'''
          new = '''\t\tawait this.terminate(this.chrome, CHROME_SHUTDOWN_TIMEOUT_MS);
          \t\tawait this.terminate(this.vnc, VNC_SHUTDOWN_TIMEOUT_MS);'''
          assert old in text
          text = text.replace(old, new)
          old = '''\tprivate async terminate(child: ChildProcess | undefined): Promise<void> {
          \t\tif (!childRunning(child)) return;
          \t\tchild.kill("SIGTERM");
          \t\tif (await waitForExit(child, SHUTDOWN_TIMEOUT_MS)) return;
          \t\tchild.kill("SIGKILL");
          \t\tawait waitForExit(child, SHUTDOWN_TIMEOUT_MS);
          \t}'''
          new = '''\tprivate async terminate(child: ChildProcess | undefined, timeoutMs: number): Promise<void> {
          \t\tif (!childRunning(child)) return;
          \t\tchild.kill("SIGTERM");
          \t\tif (await waitForExit(child, timeoutMs)) return;
          \t\tchild.kill("SIGKILL");
          \t\tawait waitForExit(child, VNC_SHUTDOWN_TIMEOUT_MS);
          \t}'''
          assert old in text
          text = text.replace(old, new)
          old = 'header{display:flex;gap:12px;align-items:center;padding:10px;background:#202124}'
          new = 'header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;background:#202124}'
          assert old in text
          text = text.replace(old, new)
          old = 'button{padding:8px 14px}#screen{overflow:hidden}'
          new = 'button{padding:8px 14px}#host-text{min-width:240px;flex:0 1 360px;padding:8px;border:1px solid #555;border-radius:4px;background:#111;color:#eee}#screen{overflow:hidden}'
          assert old in text
          text = text.replace(old, new)
          old = '<span id="status">Connecting…</span><button id="save">Save account</button>'
          new = '<span id="status">Connecting…</span><input id="host-text" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste text from host"><button id="type-text" disabled>Type into focused field</button><button id="save">Save account</button>'
          assert old in text
          text = text.replace(old, new)
          path.write_text(text)

          # 4) Host-side paste helper: directly type through RFB key events so it
          # does not depend on VNC clipboard synchronization.
          path = Path("src/remote-login-client.ts")
          text = path.read_text()
          old = '''const save = requiredElement<HTMLButtonElement>("#save");
          const cancel = requiredElement<HTMLButtonElement>("#cancel");'''
          new = '''const hostText = requiredElement<HTMLInputElement>("#host-text");
          const typeText = requiredElement<HTMLButtonElement>("#type-text");
          const save = requiredElement<HTMLButtonElement>("#save");
          const cancel = requiredElement<HTMLButtonElement>("#cancel");'''
          assert old in text
          text = text.replace(old, new)
          old = '''rfb.scaleViewport = true;
          rfb.resizeSession = false;
          rfb.addEventListener("connect", () => {
          \tstatus.textContent = "Connected. Sign in, then press Save account.";
          });
          rfb.addEventListener("disconnect", () => {
          \tif (!save.disabled) status.textContent = "Remote desktop disconnected. Check status or cancel this login.";
          });'''
          new = '''rfb.scaleViewport = true;
          rfb.resizeSession = false;
          let connected = false;
          rfb.addEventListener("connect", () => {
          \tconnected = true;
          \ttypeText.disabled = false;
          \tstatus.textContent = "Connected. Sign in, then press Save account.";
          });
          rfb.addEventListener("disconnect", () => {
          \tconnected = false;
          \ttypeText.disabled = true;
          \tif (!save.disabled) status.textContent = "Remote desktop disconnected. Check status or cancel this login.";
          });

          function keysymForCharacter(character: string): number {
          \tconst codePoint = character.codePointAt(0);
          \tif (codePoint === undefined) return 0;
          \tif ((codePoint >= 0x20 && codePoint <= 0x7e) || (codePoint >= 0xa0 && codePoint <= 0xff)) return codePoint;
          \treturn 0x01000000 | codePoint;
          }

          function typeHostText(): void {
          \tconst text = hostText.value;
          \tif (text.length === 0) {
          \t\tstatus.textContent = "Paste text from the host into the field first.";
          \t\treturn;
          \t}
          \tif (!connected) {
          \t\tstatus.textContent = "Remote desktop is not connected yet.";
          \t\treturn;
          \t}
          \trfb.focus();
          \tfor (const character of text) rfb.sendKey(keysymForCharacter(character), null);
          \thostText.value = "";
          \tstatus.textContent = `Typed ${Array.from(text).length} character(s) into the focused remote field.`;
          }

          typeText.addEventListener("click", typeHostText);
          hostText.addEventListener("keydown", (event) => {
          \tif (event.key !== "Enter") return;
          \tevent.preventDefault();
          \ttypeHostText();
          });'''
          assert old in text
          text = text.replace(old, new)
          path.write_text(text)

          # 5) Make profile-release failure actionable in the Save-account flow.
          path = Path("src/browser/runtime.ts")
          text = path.read_text()
          old = '"Normal Chrome is still using the login profile. Close the dedicated Chrome window completely.",'
          new = '"Login Chrome did not release the profile after Save account; retry the login session.",'
          assert old in text
          text = text.replace(old, new)
          path.write_text(text)

          # Tests and docs.
          path = Path("test/config.test.ts")
          text = path.read_text()
          text = text.replace(
              'it("defaults remote login to three minutes, account turns to five minutes, and browser idling to 30 minutes", () => {',
              'it("defaults manual login to 30 minutes, account turns to five minutes, and browser idling to 30 minutes", () => {',
          )
          assert 'expect(resolveBrowserConfig({}).loginTimeoutMs).toBe(180_000);' in text
          text = text.replace('expect(resolveBrowserConfig({}).loginTimeoutMs).toBe(180_000);', 'expect(resolveBrowserConfig({}).loginTimeoutMs).toBe(1_800_000);')
          path.write_text(text)

          path = Path("test/chatgpt.test.ts")
          text = path.read_text()
          marker = '''describe("chatgptAuthenticationAssessment", () => {
          \tit("distinguishes authenticated, signed-out, challenge, and unconfirmed pages", async () => {'''
          replacement = '''describe("chatgptAuthenticationAssessment", () => {
          \tit("accepts current ChatGPT account-control variants and duplicate visible composers", async () => {
          \t\texpect(CHATGPT_ACCOUNT_SELECTOR).toContain('[data-testid="accounts-profile-button"]');
          \t\texpect(CHATGPT_ACCOUNT_SELECTOR).toContain('[data-testid="profile-button"]');
          \t\texpect(CHATGPT_ACCOUNT_SELECTOR).toContain('[data-testid="user-menu-button"]');
          \t\tawait expect(chatgptAuthenticationAssessment(authenticationPage("https://chatgpt.com/", 2, 1))).resolves.toMatchObject({
          \t\t\tstate: "authenticated",
          \t\t});
          \t});

          \tit("distinguishes authenticated, signed-out, challenge, and unconfirmed pages", async () => {'''
          assert marker in text
          text = text.replace(marker, replacement)
          path.write_text(text)

          path = Path("test/remote-login.test.ts")
          text = path.read_text()
          old = 'expect(await page.text()).toContain("Save account");'
          new = 'expect(await page.text()).toContain("Save account");\n\t\t\texpect(await (await fetch(url)).text()).toContain("Type into focused field");'
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path("README.md")
          text = path.read_text()
          text = text.replace('      loginTimeoutMs: 180000', '      loginTimeoutMs: 1800000')
          needle = 'Every login uses a tokenized loopback noVNC page on the server. Open the returned loopback URL directly when working on that server, or SSH-forward the port and open the same URL from another machine. After sign-in, press **Save account**; do not close Chrome manually.'
          if needle in text:
              text = text.replace(needle, needle + ' The login page also includes a host-text field: focus the target field in remote Chrome, paste text from the host into the helper, then press **Type into focused field**. The helper sends key events directly and clears the host text after sending.')
          path.write_text(text)
          PY
      - run: npm ci
      - run: npx biome format --write src/core/config.ts src/browser/chatgpt.ts src/browser/remote-login.ts src/remote-login-client.ts src/browser/runtime.ts test/config.test.ts test/chatgpt.test.ts test/remote-login.test.ts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit source and generated dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test README.md dist
          if ! git diff --cached --quiet; then
            git commit -m "fix: harden multi-account login UX"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - run: git diff --exit-code
      - run: npm run verify-package
