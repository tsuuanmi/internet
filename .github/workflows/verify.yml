name: Verify

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalize Phase 4 source
        if: github.event_name == 'push'
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replace(path, from, to) {
            let source = fs.readFileSync(path, 'utf8');
            if (to !== '' && source.includes(to)) return;
            if (!source.includes(from)) {
              if (to === '') return;
              throw new Error(`expected patch context missing in ${path}`);
            }
            source = source.replace(from, to);
            fs.writeFileSync(path, source);
          }

          replace(
            'src/workflow/runtime/coordinator.ts',
            'import type { WorkflowExecutionResultStore } from "#internet/workflow/runtime/result-store";\n',
            'import type { WorkflowExecutionResultStore } from "#internet/workflow/runtime/result-store";\nimport { routeWorkflowCapability } from "#internet/workflow/runtime/routing";\n',
          );
          replace(
            'src/workflow/runtime/coordinator.ts',
            'function sameRef(left: { id: string; version: string }, right: { id: string; version: string }): boolean {\n\treturn left.id === right.id && left.version === right.version;\n}\n\n',
            '',
          );
          replace(
            'src/workflow/runtime/coordinator.ts',
            'const capability = this.dependencies.capabilities.resolve(materialization.capability);\n\t\t\tif (!run.definitions.capabilities.some((ref) => sameRef(ref, capability)))\n\t\t\t\tthrow new Error(\n\t\t\t\t\t`workflow capability ${capability.id}@${capability.version} is not pinned by run ${run.runId}`,\n\t\t\t\t);\n\t\t\tif (!capability.acceptedNeedTypes.includes(need.type))\n\t\t\t\tthrow new Error(`workflow capability ${capability.id} does not accept Need type ${need.type}`);',
            'const capability = routeWorkflowCapability(\n\t\t\t\trun,\n\t\t\t\tneed,\n\t\t\t\tthis.dependencies.capabilities,\n\t\t\t\tmaterialization.capability,\n\t\t\t);',
          );
          replace(
            'src/workflow/runtime/coordinator.ts',
            '\tasync execute(\n',
            '\theartbeat(runId: string, executionId: string, ownerInstanceId: string): WorkflowExecution {\n\t\tconst current = this.dependencies.executions.get(runId, executionId);\n\t\tif (current === undefined || current.state !== "RUNNING")\n\t\t\tthrow new Error(`workflow execution ${executionId} is not running`);\n\t\tif (current.ownerInstanceId !== ownerInstanceId) throw new Error("workflow execution heartbeat owner mismatch");\n\t\tif (Date.parse(current.leaseUntil) <= this.now()) {\n\t\t\tthis.fenceExecution(current, "LEASE_EXPIRED", "workflow execution lease expired before heartbeat");\n\t\t\tthrow new Error("workflow execution lease has expired");\n\t\t}\n\t\tconst at = new Date(this.now()).toISOString();\n\t\treturn this.dependencies.executions.update(runId, executionId, current.revision, (value) => ({\n\t\t\t...value,\n\t\t\trevision: value.revision + 1,\n\t\t\theartbeatAt: at,\n\t\t\tleaseUntil: new Date(this.now() + this.leaseMs).toISOString(),\n\t\t}));\n\t}\n\n\tasync execute(\n',
          );
          replace(
            'src/workflow/runtime/coordinator.ts',
            'const result = await executor.execute({ run, workItem: running, execution, inputBundle: bundle }, signal);\n\t\t\tconst current = this.dependencies.executions.get(runId, executionId);\n\t\t\tif (current === undefined || current.state !== "RUNNING" || Date.parse(current.leaseUntil) <= this.now())\n\t\t\t\tthrow new Error("workflow execution lost its lease before result persistence");\n\t\t\tconst stored = this.dependencies.results.create(current, result);',
            'const result = await executor.execute(\n\t\t\t\t{\n\t\t\t\t\trun,\n\t\t\t\t\tworkItem: running,\n\t\t\t\t\texecution,\n\t\t\t\t\tinputBundle: bundle,\n\t\t\t\t\theartbeat: () => this.heartbeat(runId, executionId, ownerInstanceId),\n\t\t\t\t},\n\t\t\t\tsignal,\n\t\t\t);\n\t\t\tconst current = this.dependencies.executions.get(runId, executionId);\n\t\t\tif (current === undefined || current.state !== "RUNNING") return this.advance(runId);\n\t\t\tif (Date.parse(current.leaseUntil) <= this.now()) {\n\t\t\t\tawait this.reconcileExpiredExecution(current, signal);\n\t\t\t\treturn this.advance(runId);\n\t\t\t}\n\t\t\tconst stored = this.dependencies.results.create(current, result);',
          );

          const indexPath = 'src/index.ts';
          let index = fs.readFileSync(indexPath, 'utf8');
          const runtimeExport = 'export * from "#internet/workflow/runtime/index";\n';
          if (!index.includes(runtimeExport)) index += `\n${runtimeExport}`;
          fs.writeFileSync(indexPath, index);
          NODE
          npx biome check --write src/workflow/runtime src/workflow/kernel src/workflow/semantic/validation.ts src/index.ts test/workflow-runtime-*.test.ts test/workflow-work-item-store.test.ts test/workflow-semantic-promotion.test.ts test/workflow-kernel-public-api.test.ts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit normalized source and generated dist
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- src test dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A src test dist
            git commit -m "build: finalize phase 4 runtime artifacts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify generated dist
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"
      - run: npm run verify-package
