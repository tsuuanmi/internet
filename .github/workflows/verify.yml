name: Verify

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalize Phase 4 source
        if: github.event_name == 'push'
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replace(path, from, to) {
            let source = fs.readFileSync(path, 'utf8');
            if (to !== '' && source.includes(to)) return;
            if (!source.includes(from)) {
              if (to === '') return;
              throw new Error(`expected patch context missing in ${path}`);
            }
            source = source.replace(from, to);
            fs.writeFileSync(path, source);
          }

          replace('src/workflow/runtime/coordinator.ts', '\ttype WorkflowNeedPayload,\n', '');
          replace(
            'src/workflow/runtime/coordinator.ts',
            'function workItemIdFor(needArtifact: WorkflowArtifact, capabilityId: string, generation: number): string {\n\treturn hashCanonicalJson({\n\t\trunId: needArtifact.runId,\n\t\tneedArtifactId: needArtifact.artifactId,\n\t\tcapabilityId,\n\t\tgeneration,\n\t}).slice(0, 32);\n}',
            'function workItemIdFor(\n\tneedArtifact: WorkflowArtifact,\n\tcapability: { id: string; version: string },\n\tgeneration: number,\n): string {\n\treturn hashCanonicalJson({\n\t\trunId: needArtifact.runId,\n\t\tneedArtifactId: needArtifact.artifactId,\n\t\tcapability,\n\t\tgeneration,\n\t}).slice(0, 32);\n}',
          );
          replace(
            'src/workflow/runtime/coordinator.ts',
            'workItemId: workItemIdFor(artifact, capability.id, generation),',
            'workItemId: workItemIdFor(artifact, capability, generation),',
          );
          replace(
            'src/workflow/runtime/coordinator.ts',
            'const stored = this.dependencies.results.create(runId, result);',
            'const stored = this.dependencies.results.create(current, result);',
          );
          replace(
            'src/workflow/runtime/coordinator.ts',
            'const stored = this.dependencies.results.create(execution.runId, result);',
            'const stored = this.dependencies.results.create(execution, result);',
          );
          replace(
            'src/workflow/runtime/coordinator.ts',
            'const readiness = this.dependencies.policy.readiness(context, item);\n\t\t\tif (!readiness.ready) continue;',
            'const readiness = this.dependencies.policy.readiness(context, item);\n\t\t\tif (readiness.ready && readiness.blockers.length > 0)\n\t\t\t\tthrow new Error("workflow readiness cannot be ready with blockers");\n\t\t\tif (!readiness.ready) continue;',
          );
          replace(
            'src/workflow/runtime/coordinator.ts',
            'for (const item of staleWorkflowWorkItems(items, bundles, artifacts)) {\n\t\t\tconst current = this.dependencies.workItems.get(runId, item.workItemId);',
            'for (const item of staleWorkflowWorkItems(items, bundles, artifacts)) {\n\t\t\tfor (const execution of this.dependencies.executions.list(runId)) {\n\t\t\t\tif (execution.workItemId === item.workItemId && execution.state === "RUNNING")\n\t\t\t\t\tthis.fenceExecution(execution, "INPUT_INVALIDATED", "execution input was invalidated");\n\t\t\t}\n\t\t\tconst current = this.dependencies.workItems.get(runId, item.workItemId);',
          );
          replace(
            'src/workflow/runtime/coordinator.ts',
            'const openExternal = this.dependencies.artifacts\n\t\t\t\t.list(run.runId)\n\t\t\t\t.filter((artifact) => artifact.type === WORKFLOW_SEMANTIC_ARTIFACT_TYPES.need)\n\t\t\t\t.some((artifact) => this.dependencies.pendingActions.hasOpen(run.runId, artifact.artifactId));',
            'const artifacts = this.dependencies.artifacts.list(run.runId);\n\t\t\tconst currentArtifacts = currentWorkflowArtifactIds(artifacts);\n\t\t\tconst openExternal = artifacts\n\t\t\t\t.filter(\n\t\t\t\t\t(artifact) =>\n\t\t\t\t\t\tartifact.type === WORKFLOW_SEMANTIC_ARTIFACT_TYPES.need && currentArtifacts.has(artifact.artifactId),\n\t\t\t\t)\n\t\t\t\t.some((artifact) => this.dependencies.pendingActions.hasOpen(run.runId, artifact.artifactId));',
          );

          const indexPath = 'src/index.ts';
          let index = fs.readFileSync(indexPath, 'utf8');
          const runtimeExport = 'export * from "#internet/workflow/runtime/index";\n';
          if (!index.includes(runtimeExport)) index += `\n${runtimeExport}`;
          fs.writeFileSync(indexPath, index);
          NODE
          npx biome check --write src/workflow/runtime src/workflow/kernel src/workflow/semantic/validation.ts src/index.ts test/workflow-runtime-*.test.ts test/workflow-work-item-store.test.ts test/workflow-semantic-promotion.test.ts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit normalized source and generated dist
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- src test dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A src test dist
            git commit -m "build: finalize phase 4 runtime artifacts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify generated dist
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"
      - run: npm run verify-package
