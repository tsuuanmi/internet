name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate MCP dependency lock
        run: |
          timeout 180s npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact @modelcontextprotocol/server@2.1.0
          node -e 'const fs=require("node:fs"); for (const f of ["package.json","package-lock.json"]) console.log("PACKAGE_CAPTURE "+f+" "+fs.readFileSync(f).toString("base64"))'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify generated dist
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"
      - run: npm run verify-package
