name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: git status --short -- dist > dist-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: generated-dist
          path: |
            dist
            dist-status.txt
      - run: git diff --exit-code -- dist
      - run: npm run verify-package
