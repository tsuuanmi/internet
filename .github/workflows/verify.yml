name: Verify

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow/phase8-workstream-continuation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalize Phase 8 source
        run: npx biome check --write src test scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify-package
      - name: Commit normalized source and generated dist
        run: |
          if [ -z "$(git status --porcelain -- src test dist)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test dist
          git commit -m "build: normalize phase 8 workstream continuation"
          git push origin HEAD:workflow/phase8-workstream-continuation
