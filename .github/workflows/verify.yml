name: Verify

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply final Phase 3 contract review
        if: github.event_name == 'push'
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replace(path, from, to) {
            const source = fs.readFileSync(path, 'utf8');
            if (source.includes(to)) return;
            if (!source.includes(from)) throw new Error(`expected patch context missing in ${path}`);
            fs.writeFileSync(path, source.replace(from, to));
          }

          const acyclicHelper = [
            'function assertAcyclicTaskLinks(',
            '\ttasks: readonly WorkflowPlanTask[],',
            '\tlinks: (task: WorkflowPlanTask) => readonly string[],',
            '\tlabel: string,',
            '): void {',
            '\tconst byId = new Map(tasks.map((task) => [task.taskId, task]));',
            '\tconst visiting = new Set<string>();',
            '\tconst visited = new Set<string>();',
            '\tconst visit = (taskId: string): void => {',
            '\t\tif (visited.has(taskId)) return;',
            '\t\tif (visiting.has(taskId)) throw new Error("workflow plan " + label + " cycle includes " + taskId);',
            '\t\tvisiting.add(taskId);',
            '\t\tconst task = byId.get(taskId);',
            '\t\tif (task !== undefined) for (const linkedId of links(task)) visit(linkedId);',
            '\t\tvisiting.delete(taskId);',
            '\t\tvisited.add(taskId);',
            '\t};',
            '\tfor (const task of tasks) visit(task.taskId);',
            '}',
            '',
            'function assertCriterionRef(value: unknown): asserts value is WorkflowCriterionRef {',
          ].join('\n');
          replace(
            'src/workflow/semantic/validation.ts',
            'function assertCriterionRef(value: unknown): asserts value is WorkflowCriterionRef {',
            acyclicHelper,
          );
          replace(
            'src/workflow/semantic/validation.ts',
            '\tfor (const task of value.tasks as readonly WorkflowPlanTask[]) {\n\t\tfor (const dependency of task.dependsOn) {\n\t\t\tif (!taskIds.has(dependency))\n\t\t\t\tthrow new Error(`workflow plan task ${task.taskId} has unknown dependency ${dependency}`);\n\t\t}\n\t\tif (task.parentTaskId !== undefined && !taskIds.has(task.parentTaskId))\n\t\t\tthrow new Error(`workflow plan task ${task.taskId} has unknown parent ${task.parentTaskId}`);\n\t}\n\tif (!Array.isArray(value.assumptions)) throw new Error("invalid workflow plan assumptions");',
            '\tconst tasks = value.tasks as readonly WorkflowPlanTask[];\n\tfor (const task of tasks) {\n\t\tfor (const dependency of task.dependsOn) {\n\t\t\tif (!taskIds.has(dependency))\n\t\t\t\tthrow new Error(`workflow plan task ${task.taskId} has unknown dependency ${dependency}`);\n\t\t}\n\t\tif (task.parentTaskId !== undefined && !taskIds.has(task.parentTaskId))\n\t\t\tthrow new Error(`workflow plan task ${task.taskId} has unknown parent ${task.parentTaskId}`);\n\t}\n\tassertAcyclicTaskLinks(tasks, (task) => task.dependsOn, "dependency");\n\tassertAcyclicTaskLinks(tasks, (task) => (task.parentTaskId === undefined ? [] : [task.parentTaskId]), "parent");\n\tif (!Array.isArray(value.assumptions)) throw new Error("invalid workflow plan assumptions");',
          );

          replace(
            'src/workflow/semantic/planning.ts',
            '\ttype WorkflowNeedPayload,\n\ttype WorkflowObjectivePayload,',
            '\ttype WorkflowNeedPayload,\n\ttype WorkflowNeedType,\n\ttype WorkflowObjectivePayload,',
          );
          replace(
            'src/workflow/semantic/planning.ts',
            'export type WorkflowPlanningMode = (typeof WORKFLOW_PLANNING_MODES)[number];\n\nexport const WORKFLOW_PLANNING_INPUT_SCHEMA',
            'export type WorkflowPlanningMode = (typeof WORKFLOW_PLANNING_MODES)[number];\nexport type WorkflowPlanningNeedType = Exclude<WorkflowNeedType, "execution">;\n\nexport const WORKFLOW_PLANNING_MODE_BY_NEED_TYPE = {\n\tplanning: "INITIAL",\n\tplan_change: "PLAN_CHANGE",\n\trequirements_change: "REQUIREMENTS_CHANGE",\n\tclarification: "CLARIFICATION",\n} as const satisfies Readonly<Record<WorkflowPlanningNeedType, WorkflowPlanningMode>>;\n\nexport const WORKFLOW_PLANNING_INPUT_SCHEMA',
          );
          replace(
            'src/workflow/semantic/planning.ts',
            '\tacceptedNeedTypes: ["planning", "plan_change", "requirements_change", "clarification"],',
            '\tacceptedNeedTypes: Object.keys(WORKFLOW_PLANNING_MODE_BY_NEED_TYPE),',
          );
          replace(
            'src/workflow/semantic/planning.ts',
            'function parseMode(value: unknown): WorkflowPlanningMode {',
            'export function workflowPlanningModeForNeedType(needType: WorkflowNeedType): WorkflowPlanningMode | undefined {\n\tif (needType === "execution") return undefined;\n\treturn WORKFLOW_PLANNING_MODE_BY_NEED_TYPE[needType];\n}\n\nfunction parseMode(value: unknown): WorkflowPlanningMode {',
          );
          replace(
            'src/workflow/semantic/planning.ts',
            '\treturn parseWorkflowPlanningOutput(await executor.execute(request));\n}',
            '\tconst output = parseWorkflowPlanningOutput(await executor.execute(request));\n\tif (output.mode !== request.mode) throw new Error("workflow planning output mode does not match request");\n\treturn output;\n}',
          );

          replace(
            'src/workflow/semantic/index.ts',
            '\tparseWorkflowPlanningOutput,\n\tWORKFLOW_PLANNING_CAPABILITY,',
            '\tparseWorkflowPlanningOutput,\n\tworkflowPlanningModeForNeedType,\n\tWORKFLOW_PLANNING_CAPABILITY,',
          );
          replace(
            'src/workflow/semantic/index.ts',
            '\tWORKFLOW_PLANNING_INPUT_SCHEMA,\n\tWORKFLOW_PLANNING_MODES,',
            '\tWORKFLOW_PLANNING_INPUT_SCHEMA,\n\tWORKFLOW_PLANNING_MODE_BY_NEED_TYPE,\n\tWORKFLOW_PLANNING_MODES,',
          );
          replace(
            'src/workflow/semantic/index.ts',
            '\ttype WorkflowPlanningExecutor,\n\ttype WorkflowPlanningMode,',
            '\ttype WorkflowPlanningExecutor,\n\ttype WorkflowPlanningMode,\n\ttype WorkflowPlanningNeedType,',
          );

          replace(
            'test/workflow-semantic-planning.test.ts',
            '\tparseWorkflowPlanningOutput,\n\tWORKFLOW_PLANNING_CAPABILITY,',
            '\tparseWorkflowPlanningOutput,\n\tworkflowPlanningModeForNeedType,\n\tWORKFLOW_PLANNING_CAPABILITY,',
          );
          replace(
            'test/workflow-semantic-planning.test.ts',
            '\tit("validates executor output at the planning boundary", async () => {',
            '\tit("derives Planner re-entry mode from typed Need semantics", () => {\n\t\texpect(workflowPlanningModeForNeedType("planning")).toBe("INITIAL");\n\t\texpect(workflowPlanningModeForNeedType("plan_change")).toBe("PLAN_CHANGE");\n\t\texpect(workflowPlanningModeForNeedType("requirements_change")).toBe("REQUIREMENTS_CHANGE");\n\t\texpect(workflowPlanningModeForNeedType("clarification")).toBe("CLARIFICATION");\n\t\texpect(workflowPlanningModeForNeedType("execution")).toBeUndefined();\n\t});\n\n\tit("validates executor output at the planning boundary", async () => {',
          );
          replace(
            'test/workflow-semantic-planning.test.ts',
            '\tit("keeps plan changes distinct from requirements changes", () => {',
            '\tit("rejects executor output for a different planning mode", async () => {\n\t\tawait expect(\n\t\t\texecuteWorkflowPlanning(\n\t\t\t\t{ execute: async () => ({ ...initialOutput, mode: "REQUIREMENTS_CHANGE" }) },\n\t\t\t\t{ mode: "INITIAL", inputBundle },\n\t\t\t),\n\t\t).rejects.toThrow("output mode does not match request");\n\t});\n\n\tit("keeps plan changes distinct from requirements changes", () => {',
          );
          replace(
            'test/workflow-semantic-validation.test.ts',
            '\tit("rejects Need types outside the registered semantic vocabulary", () => {',
            '\tit("rejects cyclic PlanTask dependencies", () => {\n\t\texpect(() =>\n\t\t\tparseWorkflowPlanPayload({\n\t\t\t\tplanId: "plan-cycle",\n\t\t\t\tversion: "1",\n\t\t\t\tobjective: objectiveArtifact,\n\t\t\t\tacceptanceCriteria: criteriaArtifact,\n\t\t\t\ttasks: [\n\t\t\t\t\t{ taskId: "task-1", title: "One", description: "First task", dependsOn: ["task-2"], criterionIds: [], needIds: [] },\n\t\t\t\t\t{ taskId: "task-2", title: "Two", description: "Second task", dependsOn: ["task-1"], criterionIds: [], needIds: [] },\n\t\t\t\t],\n\t\t\t\tassumptions: [],\n\t\t\t\trisks: [],\n\t\t\t}),\n\t\t).toThrow("dependency cycle");\n\t});\n\n\tit("rejects Need types outside the registered semantic vocabulary", () => {',
          );
          NODE
          npx biome check --write src/workflow/semantic test/workflow-semantic-planning.test.ts test/workflow-semantic-validation.test.ts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit final Phase 3 source and dist
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- src test dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A src test dist
            git commit -m "refactor: complete phase 3 semantic contracts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify generated dist
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"
      - run: npm run verify-package
