name: Verify

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalize Phase 4 source
        if: github.event_name == 'push'
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replace(path, from, to) {
            let source = fs.readFileSync(path, 'utf8');
            if (source.includes(to)) return;
            if (!source.includes(from)) throw new Error(`expected patch context missing in ${path}`);
            source = source.replace(from, to);
            fs.writeFileSync(path, source);
          }

          const validationPath = 'src/workflow/semantic/validation.ts';
          let validation = fs.readFileSync(validationPath, 'utf8');
          validation = validation.replace(
            'function assertRecordValue(value: unknown, label: string): asserts value is Readonly<Record<string, unknown>> {\n\tif (!isRecord(value)) throw new Error(`invalid ${label}`);\n}\n\n',
            '',
          );
          fs.writeFileSync(validationPath, validation);

          replace(
            'src/workflow/runtime/coordinator.ts',
            '\ttype WorkflowNeedPayload,\n',
            '',
          );
          replace(
            'src/workflow/runtime/coordinator.ts',
            'export class WorkflowRunCoordinator {\n\tprivate readonly leaseMs: number;\n\tprivate readonly now: () => number;\n\n\tconstructor(\n\t\tprivate readonly dependencies: WorkflowRunCoordinatorDependencies,\n\t\toptions: WorkflowRunCoordinatorOptions = {},\n\t) {\n\t\tthis.leaseMs = options.leaseMs ?? 5 * 60_000;',
            'export class WorkflowRunCoordinator {\n\tprivate readonly dependencies: WorkflowRunCoordinatorDependencies;\n\tprivate readonly leaseMs: number;\n\tprivate readonly now: () => number;\n\n\tconstructor(dependencies: WorkflowRunCoordinatorDependencies, options: WorkflowRunCoordinatorOptions = {}) {\n\t\tthis.dependencies = dependencies;\n\t\tthis.leaseMs = options.leaseMs ?? 5 * 60_000;',
          );
          replace(
            'src/workflow/runtime/driver.ts',
            'export class WorkflowRunDriver {\n\tprivate readonly active = new Map<string, ActiveRun>();\n\tprivate disposed = false;\n\n\tconstructor(\n\t\tprivate readonly coordinator: WorkflowRunCoordinator,\n\t\tprivate readonly runs: WorkflowRunStore,\n\t) {}',
            'export class WorkflowRunDriver {\n\tprivate readonly active = new Map<string, ActiveRun>();\n\tprivate readonly coordinator: WorkflowRunCoordinator;\n\tprivate readonly runs: WorkflowRunStore;\n\tprivate disposed = false;\n\n\tconstructor(coordinator: WorkflowRunCoordinator, runs: WorkflowRunStore) {\n\t\tthis.coordinator = coordinator;\n\t\tthis.runs = runs;\n\t}',
          );

          const indexPath = 'src/index.ts';
          let index = fs.readFileSync(indexPath, 'utf8');
          const runtimeExport = 'export * from "#internet/workflow/runtime/index";\n';
          if (!index.includes(runtimeExport)) index += `\n${runtimeExport}`;
          fs.writeFileSync(indexPath, index);
          NODE
          npx biome check --write src/workflow/runtime src/workflow/kernel src/workflow/semantic/validation.ts src/index.ts test/workflow-runtime-*.test.ts test/workflow-work-item-store.test.ts test/workflow-semantic-promotion.test.ts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit normalized source and generated dist
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- src test dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A src test dist
            git commit -m "build: normalize phase 4 runtime artifacts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify generated dist
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"
      - run: npm run verify-package
