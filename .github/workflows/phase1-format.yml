name: Phase1 Format

on:
  push:
    branches:
      - workflow/phase1-durable-admission
    paths:
      - .github/workflows/phase1-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow/phase1-durable-admission
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome check --write src test scripts
      - name: Commit formatting
        run: |
          if git diff --quiet -- src test scripts; then
            echo "sources already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test scripts
          git commit -m "style: format phase1 admission sources"
          git push origin HEAD:workflow/phase1-durable-admission
