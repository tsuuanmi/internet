name: Phase1 Plan Sync

on:
  push:
    branches:
      - workflow/phase1-durable-admission
    paths:
      - .github/workflows/phase1-plan-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow/phase1-durable-admission
      - run: node scripts/phase1-plan-sync.mjs
      - name: Commit planning updates and remove helpers
        run: |
          git rm .github/workflows/phase1-plan-sync.yml scripts/phase1-plan-sync.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: align planning artifacts with phase1 implementation'
          git push origin HEAD:workflow/phase1-durable-admission
