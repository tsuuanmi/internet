name: P1 finalize

on:
  push:
    branches:
      - impl/p1-multi-account-foundation

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 scripts/p1-finalize-account-tests.py
      - run: npx biome check --write src test
      - name: Commit finalized source and tests
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test
          if git diff --cached --quiet; then
            echo 'source and tests already finalized'
            exit 0
          fi
          git commit -m 'fix: finalize account-aware runtime and tests'
          git push
