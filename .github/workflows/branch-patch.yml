name: Branch routing rewrite

on:
  push:
    branches:
      - feat/provider-agnostic-team-status

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-agnostic-team-status
      - name: Update workflow routing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/workflow/engine.ts')
          text = path.read_text()
          old = 'thinkerAccounts: ["chatgpt-thinker", "gemini-thinker"],'
          new = 'thinkerAccounts: ["chatgpt-thinker", "chatgpt-thinker-2"],'
          if old not in text:
              raise SystemExit('expected workflow thinker routing was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/branch-patch.yml
      - name: Commit rewrite
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/workflow/engine.ts .github/workflows/branch-patch.yml
          git commit -m "refactor: route workflow through two ChatGPT members"
          git push origin HEAD:feat/provider-agnostic-team-status
