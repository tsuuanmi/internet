name: Format graph branch

on:
  push:
    branches:
      - docs/workflow-graph-recovery

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Move scheduler failure transition into engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          driver = Path("src/workflow/driver.ts")
          text = driver.read_text()
          old = '''\texecuteNode(jobId: string, nodeId: string, ownerInstanceId: string, signal?: AbortSignal): Promise<WorkflowJob>;\n\tcancel(jobId: string): WorkflowJob;\n'''
          new = '''\texecuteNode(jobId: string, nodeId: string, ownerInstanceId: string, signal?: AbortSignal): Promise<WorkflowJob>;\n\tblockSchedulerFailure(jobId: string, error: unknown): WorkflowJob;\n\tcancel(jobId: string): WorkflowJob;\n'''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace("\t\t\t\tthis.blockRuntimeFailure(jobId, error);", "\t\t\t\tthis.engine.blockSchedulerFailure(jobId, error);", 1)
          start = text.index("\n\tprivate blockRuntimeFailure(jobId: string, error: unknown): void {")
          end = text.index("\n\tprivate async drive", start)
          text = text[:start] + text[end:]
          driver.write_text(text)

          engine = Path("src/workflow/engine.ts")
          text = engine.read_text()
          marker = '''\n\tcancel(jobId: string): WorkflowJob {\n'''
          assert marker in text
          method = '''\n\tblockSchedulerFailure(jobId: string, error: unknown): WorkflowJob {\n\t\tconst job = this.status(jobId);\n\t\tif (workflowJobIsTerminal(job) || job.graph.lifecycle === "BLOCKED") return job;\n\t\tconst at = new Date().toISOString();\n\t\tconst message = `workflow scheduler failed: ${error instanceof Error ? error.message : String(error)}`;\n\t\treturn this.commit(\n\t\t\tjobId,\n\t\t\t{ type: "SCHEDULER_FAILED", class: "ACTION_REQUIRED", at, message },\n\t\t\t(current) => ({\n\t\t\t\t...current,\n\t\t\t\tgraph: {\n\t\t\t\t\t...current.graph,\n\t\t\t\t\tgraphRevision: current.graph.graphRevision + 1,\n\t\t\t\t\tlifecycle: "BLOCKED",\n\t\t\t\t},\n\t\t\t\tpendingAction: { kind: "CODE_FIX_REQUIRED", message },\n\t\t\t}),\n\t\t);\n\t}\n'''
          text = text.replace(marker, method + marker, 1)
          engine.write_text(text)
          PY
      - run: npx biome check --write src test scripts
      - name: Commit refactor and formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test scripts
          git commit -m "refactor(workflow): keep scheduler transitions in engine"
          git push origin HEAD:docs/workflow-graph-recovery
