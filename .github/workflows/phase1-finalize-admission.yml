name: Phase1 Finalize Admission

on:
  push:
    branches:
      - workflow/phase1-durable-admission
    paths:
      - .github/workflows/phase1-finalize-admission.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow/phase1-durable-admission
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refactor admission boundaries
        run: |
          cat > src/workflow/profiles/software-admission.ts <<'EOF'
          import type { WorkflowAdmissionDraftInput, WorkflowAdmissionProvenance } from "#internet/workflow/admission/types";

          export interface SoftwareAdmissionInput {
          	readonly rawSource: string;
          	readonly sourceProvenance: "user_explicit" | "local_interpreted";
          	readonly repository: string;
          	readonly baseRevision: string;
          	readonly targetProvenance: Extract<WorkflowAdmissionProvenance, "system_observed" | "local_interpreted">;
          	readonly authorityProvenance: Extract<WorkflowAdmissionProvenance, "user_explicit" | "local_interpreted">;
          }

          export function createSoftwareAdmissionDraft(input: SoftwareAdmissionInput): WorkflowAdmissionDraftInput {
          	return {
          		source: {
          			kind: input.sourceProvenance === "user_explicit" ? "user" : "local_agent",
          			rawText: input.rawSource,
          			provenance: input.sourceProvenance,
          		},
          		profileHint: { value: "software_change", provenance: "policy_default" },
          		target: {
          			repository: { value: input.repository, provenance: input.targetProvenance },
          			baseRevision: { value: input.baseRevision, provenance: input.targetProvenance },
          		},
          		authority: {
          			repositoryMutation: { value: true, provenance: input.authorityProvenance },
          		},
          		autonomy: { value: "autonomous_until_external_dependency", provenance: "policy_default" },
          	};
          }
          EOF

          cat > src/workflow/service.ts <<'EOF'
          import type { WorkflowAdmissionService } from "#internet/workflow/admission/service";
          import type {
          	AdmissionConfirmationInput,
          	WorkflowAdmissionDraftInput,
          	WorkflowAdmissionRecord,
          } from "#internet/workflow/admission/types";
          import { requireWorkflowOwnerSessionId, type WorkflowAuthorizationContext } from "#internet/workflow/authorization";
          import type { WorkflowJobStore } from "#internet/workflow/job-store";
          import { createSoftwareWorkflowActivator } from "#internet/workflow/profiles/software-activation";
          import type { WorkflowDeletionReceipt, WorkflowRetentionManager } from "#internet/workflow/retention";
          import type { StartWorkflowInput, WorkflowJob } from "#internet/workflow/types";
          import { workflowJobIsTerminal } from "#internet/workflow/types";

          export interface WorkflowServiceEngine {
          	start(input: StartWorkflowInput): WorkflowJob;
          	continue(jobId: string): WorkflowJob;
          }

          export interface WorkflowServiceDriver {
          	enqueue(jobId: string): void;
          	cancel(jobId: string): Promise<WorkflowJob>;
          	isActive(jobId: string): boolean;
          }

          export class WorkflowServiceError extends Error {
          	constructor(message: string) {
          		super(message);
          		this.name = "WorkflowServiceError";
          	}
          }

          function preflightFailure(record: WorkflowAdmissionRecord): WorkflowServiceError {
          	const preview = record.preview;
          	const reasons = [...(preview?.errors ?? []), ...(preview?.unresolved.map((field) => `unresolved ${field}`) ?? [])];
          	return new WorkflowServiceError(
          		`workflow admission ${record.admissionId} cannot activate: ${reasons.join("; ") || "preflight did not accept the request"}`,
          	);
          }

          export class WorkflowService {
          	constructor(
          		private readonly engine: WorkflowServiceEngine,
          		private readonly driver: WorkflowServiceDriver,
          		private readonly jobs: WorkflowJobStore,
          		private readonly retention: WorkflowRetentionManager,
          		private readonly admissions: WorkflowAdmissionService,
          	) {}

          	admit(context: WorkflowAuthorizationContext, input: WorkflowAdmissionDraftInput): WorkflowAdmissionRecord {
          		requireWorkflowOwnerSessionId(context);
          		const created = this.admissions.create(context.principal, input);
          		return this.admissions.preflight(context.principal, created.admissionId, created.revision);
          	}

          	confirmAdmission(
          		context: WorkflowAuthorizationContext,
          		admissionId: string,
          		expectedRevision: number,
          		input: AdmissionConfirmationInput,
          	): WorkflowAdmissionRecord {
          		requireWorkflowOwnerSessionId(context);
          		return this.admissions.confirm(context.principal, admissionId, expectedRevision, input);
          	}

          	start(context: WorkflowAuthorizationContext, input: WorkflowAdmissionDraftInput): WorkflowJob {
          		const admitted = this.admit(context, input);
          		if (admitted.state === "PREFLIGHTED") throw preflightFailure(admitted);
          		if (admitted.state === "AWAITING_CONFIRMATION") {
          			throw new WorkflowServiceError(
          				`workflow admission ${admitted.admissionId} requires ${admitted.preview?.confirmation.level ?? "confirmation"} before activation`,
          			);
          		}
          		if (admitted.state !== "ACCEPTED" || admitted.acceptedSpecHash === undefined) {
          			throw new WorkflowServiceError(`workflow admission ${admitted.admissionId} did not reach accepted state`);
          		}
          		return this.activateAdmission(context, admitted.admissionId, admitted.acceptedSpecHash);
          	}

          	activateAdmission(
          		context: WorkflowAuthorizationContext,
          		admissionId: string,
          		expectedAcceptedSpecHash: string,
          	): WorkflowJob {
          		const ownerSessionId = requireWorkflowOwnerSessionId(context);
          		const activator = createSoftwareWorkflowActivator(this.engine, this.driver, this.jobs, ownerSessionId);
          		const record = this.admissions.activate(context.principal, admissionId, expectedAcceptedSpecHash, activator);
          		if (record.activation?.targetKind !== "workflow_job") {
          			throw new WorkflowServiceError(`workflow admission ${admissionId} did not activate a software workflow job`);
          		}
          		const job = this.jobs.get(record.activation.targetId);
          		if (job === undefined) {
          			throw new WorkflowServiceError(`activated workflow job ${record.activation.targetId} does not exist`);
          		}
          		return job;
          	}

          	list(context: WorkflowAuthorizationContext): readonly WorkflowJob[] {
          		return this.ownerJobs(requireWorkflowOwnerSessionId(context));
          	}

          	status(context: WorkflowAuthorizationContext, jobId?: string): WorkflowJob {
          		return this.selectJob(context, jobId, false);
          	}

          	async cancel(context: WorkflowAuthorizationContext, jobId?: string): Promise<WorkflowJob> {
          		const selected = this.selectJob(context, jobId, true);
          		return this.driver.cancel(selected.jobId);
          	}

          	continue(context: WorkflowAuthorizationContext, jobId?: string): WorkflowJob {
          		const selected = this.selectJob(context, jobId, true);
          		if (this.driver.isActive(selected.jobId)) {
          			throw new WorkflowServiceError(`workflow job ${selected.jobId} already has an active driver`);
          		}
          		if (selected.graph.lifecycle !== "BLOCKED" && selected.graph.lifecycle !== "RECOVERING") {
          			throw new WorkflowServiceError(`workflow job ${selected.jobId} has no explicit recovery path`);
          		}
          		const resumed = this.engine.continue(selected.jobId);
          		this.driver.enqueue(resumed.jobId);
          		return resumed;
          	}

          	async delete(context: WorkflowAuthorizationContext, jobId?: string): Promise<WorkflowDeletionReceipt> {
          		if (jobId === undefined) throw new WorkflowServiceError("/workflow delete requires an explicit jobId");
          		const ownerSessionId = requireWorkflowOwnerSessionId(context);
          		const selected = this.selectJob(context, jobId, false);
          		const terminal = workflowJobIsTerminal(selected) ? selected : await this.driver.cancel(selected.jobId);
          		return this.retention.deleteNow({
          			jobId: terminal.jobId,
          			expectedUpdatedAt: terminal.updatedAt,
          			operatorSessionId: ownerSessionId,
          		});
          	}

          	isActive(jobId: string): boolean {
          		return this.driver.isActive(jobId);
          	}

          	private ownerJobs(ownerSessionId: string): readonly WorkflowJob[] {
          		return this.jobs
          			.list()
          			.filter((job) => job.ownerSessionId === ownerSessionId)
          			.sort((a, b) => b.updatedAt.localeCompare(a.updatedAt) || a.jobId.localeCompare(b.jobId));
          	}

          	private selectJob(
          		context: WorkflowAuthorizationContext,
          		explicitJobId: string | undefined,
          		requireActive: boolean,
          	): WorkflowJob {
          		const ownerSessionId = requireWorkflowOwnerSessionId(context);
          		const owned = this.ownerJobs(ownerSessionId);
          		if (explicitJobId !== undefined) {
          			const job = owned.find((candidate) => candidate.jobId === explicitJobId);
          			if (job === undefined) {
          				throw new WorkflowServiceError(`workflow job ${explicitJobId} does not belong to this session`);
          			}
          			if (requireActive && workflowJobIsTerminal(job)) {
          				throw new WorkflowServiceError(`workflow job ${job.jobId} is already terminal (${job.graph.lifecycle})`);
          			}
          			return job;
          		}
          		const active = owned.filter((job) => !workflowJobIsTerminal(job));
          		if (active.length === 1) return active[0]!;
          		if (active.length > 1) {
          			throw new WorkflowServiceError(
          				`multiple active workflows exist for this session; specify a jobId: ${active.map((job) => job.jobId).join(", ")}`,
          			);
          		}
          		if (requireActive) throw new WorkflowServiceError("this session has no active workflow");
          		if (owned.length === 1) return owned[0]!;
          		if (owned.length === 0) throw new WorkflowServiceError("this session has no workflow jobs");
          		throw new WorkflowServiceError(
          			`no active workflow exists and multiple historical jobs are available; specify a jobId: ${owned.map((job) => job.jobId).join(", ")}`,
          		);
          	}
          }
          EOF

          cat > src/commands/workflow.ts <<'EOF'
          import type { CommandDefinition } from "@deepseek-ai/dsh-commands";
          import type { WorkflowAdmissionDraftInput } from "#internet/workflow/admission/types";
          import { workflowSessionAuthorizationContext, type WorkflowAuthorizationContext } from "#internet/workflow/authorization";
          import { WorkflowOperatorError } from "#internet/workflow/operator";
          import { createSoftwareAdmissionDraft } from "#internet/workflow/profiles/software-admission";
          import {
          	type GitRunner,
          	resolveWorkflowRepository,
          	runGitCommand,
          	WorkflowRepositoryError,
          } from "#internet/workflow/repository-context";
          import { WorkflowServiceError } from "#internet/workflow/service";
          import type { WorkflowJob } from "#internet/workflow/types";

          const USAGE = "Usage: /workflow <objective> | list | status [jobId] | stop [jobId] | continue [jobId] | delete <jobId>";
          const OPERATIONS = new Set(["list", "status", "stop", "continue", "delete"]);

          export type { GitRunner } from "#internet/workflow/repository-context";
          export { normalizeRepositoryUrl } from "#internet/workflow/repository-context";

          export interface WorkflowCommandService {
          	start(context: WorkflowAuthorizationContext, input: WorkflowAdmissionDraftInput): WorkflowJob;
          }

          export interface WorkflowCommandOperator {
          	list(ownerSessionId: string): string;
          	status(ownerSessionId: string, jobId?: string): string;
          	stop(ownerSessionId: string, jobId?: string): Promise<string>;
          	continue(ownerSessionId: string, jobId?: string): string;
          	delete(ownerSessionId: string, jobId?: string): Promise<string>;
          }

          export interface WorkflowCommandDependencies {
          	readonly service: WorkflowCommandService;
          	readonly operator: WorkflowCommandOperator;
          	readonly runGit?: GitRunner;
          }

          function operationInput(rawInput: string): { operation: string; jobId?: string } | undefined {
          	const parts = rawInput.trim().split(/\s+/u);
          	const operation = parts[0];
          	if (operation === undefined || !OPERATIONS.has(operation)) return undefined;
          	if (operation === "list") {
          		if (parts.length !== 1) throw new WorkflowOperatorError("/workflow list does not accept a jobId");
          		return { operation };
          	}
          	if (operation === "delete") {
          		if (parts.length !== 2 || parts[1] === undefined)
          			throw new WorkflowOperatorError("/workflow delete requires exactly one jobId");
          		return { operation, jobId: parts[1] };
          	}
          	if (parts.length > 2) throw new WorkflowOperatorError(`/workflow ${operation} accepts at most one jobId`);
          	return { operation, ...(parts[1] === undefined ? {} : { jobId: parts[1] }) };
          }

          export function defineWorkflowCommand(dependencies: WorkflowCommandDependencies): CommandDefinition {
          	const runGit = dependencies.runGit ?? runGitCommand;
          	return {
          		name: "workflow",
          		description: "start, inspect, stop, or resume a durable reviewed implementation workflow",
          		input: { hint: "<objective> | list | status [jobId] | stop [jobId] | continue [jobId] | delete <jobId>" },
          		async handler(invocation) {
          			const rawInput = invocation.rawInput.trim();
          			if (rawInput === "") return { kind: "error", text: `A workflow objective or operation is required. ${USAGE}` };
          			const ownerSessionId = String(invocation.agent.id);
          			try {
          				const parsed = operationInput(rawInput);
          				if (parsed !== undefined) {
          					if (parsed.operation === "list") return { kind: "success", text: dependencies.operator.list(ownerSessionId) };
          					if (parsed.operation === "status") return { kind: "success", text: dependencies.operator.status(ownerSessionId, parsed.jobId) };
          					if (parsed.operation === "stop") return { kind: "success", text: await dependencies.operator.stop(ownerSessionId, parsed.jobId) };
          					if (parsed.operation === "delete") return { kind: "success", text: await dependencies.operator.delete(ownerSessionId, parsed.jobId) };
          					return { kind: "success", text: dependencies.operator.continue(ownerSessionId, parsed.jobId) };
          				}

          				const cwd = invocation.agent.session.header.cwd;
          				if (cwd === undefined) return { kind: "error", text: "/workflow requires a session working directory." };
          				const repository = await resolveWorkflowRepository(cwd, invocation.signal, runGit, "/workflow");
          				const job = dependencies.service.start(
          					workflowSessionAuthorizationContext(ownerSessionId),
          					createSoftwareAdmissionDraft({
          						rawSource: rawInput,
          						sourceProvenance: "user_explicit",
          						repository: repository.url,
          						baseRevision: repository.revision,
          						targetProvenance: "system_observed",
          						authorityProvenance: "user_explicit",
          					}),
          				);
          				return { kind: "success", text: `Workflow ${job.jobId} started for ${repository.url} at ${repository.revision.slice(0, 12)}.` };
          			} catch (error) {
          				if (invocation.signal.aborted) throw error;
          				if (error instanceof WorkflowRepositoryError || error instanceof WorkflowOperatorError || error instanceof WorkflowServiceError) {
          					return { kind: "error", text: error.message };
          				}
          				if (error instanceof Error) return { kind: "error", text: error.message };
          				throw error;
          			}
          		},
          	};
          }
          EOF

          node <<'NODE'
          const fs = require('fs');
          const typesPath = 'src/workflow/admission/types.ts';
          let types = fs.readFileSync(typesPath, 'utf8');
          types = types.replace('export const WORKFLOW_ADMISSION_TARGET_KINDS = ["legacy_v3_job", "workflow_run"] as const;', 'export const WORKFLOW_ADMISSION_TARGET_KINDS = ["workflow_job"] as const;');
          fs.writeFileSync(typesPath, types);

          const activationPath = 'src/workflow/profiles/software-activation.ts';
          let activation = fs.readFileSync(activationPath, 'utf8').replaceAll('legacy_v3_job', 'workflow_job');
          fs.writeFileSync(activationPath, activation);

          const operatorPath = 'src/workflow/operator.ts';
          let operator = fs.readFileSync(operatorPath, 'utf8');
          operator = operator.replace('import { WorkflowService, WorkflowServiceError } from "#internet/workflow/service";', 'import { type WorkflowService, WorkflowServiceError } from "#internet/workflow/service";');
          fs.writeFileSync(operatorPath, operator);

          const indexPath = 'src/index.ts';
          let index = fs.readFileSync(indexPath, 'utf8');
          index = index.replace(/export type \{\n\tWorkflowAdmissionLifecycleOptions,\n\tWorkflowAdmissionOwner,\n\} from "#internet\/workflow\/admission\/service";/, 'export type { WorkflowAdmissionLifecycleOptions } from "#internet/workflow/admission/service";');
          index = index.replace(/\tAdmissionActivation,\n/, '');
          index = index.replace(/export type \{\n\tStartAuthorizedWorkflowInput,[\s\S]*?\} from "#internet\/workflow\/service";\nexport \{\n\tWorkflowService,\n\tWorkflowServiceError,\n\tworkflowSessionAuthorizationContext,\n\} from "#internet\/workflow\/service";/, 'export type { WorkflowAuthorizationContext, WorkflowPrincipal, WorkflowPrincipalKind } from "#internet/workflow/authorization";\nexport { workflowSessionAuthorizationContext } from "#internet/workflow/authorization";\nexport type { WorkflowServiceDriver, WorkflowServiceEngine } from "#internet/workflow/service";\nexport { WorkflowService, WorkflowServiceError } from "#internet/workflow/service";');
          index = index.replace('export { SOFTWARE_WORKFLOW_PROFILE } from "#internet/workflow/profiles/software-profile";', 'export { createSoftwareAdmissionDraft } from "#internet/workflow/profiles/software-admission";\nexport { SOFTWARE_WORKFLOW_PROFILE } from "#internet/workflow/profiles/software-profile";');
          fs.writeFileSync(indexPath, index);
          NODE

          npx biome check --write src test scripts
      - name: Commit source refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "refactor: make admission protocol authoritative"
          git push origin HEAD:workflow/phase1-durable-admission
