name: Branch format and build

on:
  push:
    branches:
      - feat/provider-agnostic-team-status

permissions:
  contents: write

jobs:
  format-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-agnostic-team-status
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Finalize provider-agnostic routing validation and format
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('test/workflow-engine.test.ts')
          text = test_path.read_text()
          text = text.replace('const routing: Array<readonly AccountId[]> = [];', 'const routing: Array<readonly string[]> = [];')
          test_path.write_text(text)

          store_path = Path('src/workflow/job-store.ts')
          text = store_path.read_text()
          text = text.replace(
              'import { getAccountDefinition, isAccountId } from "#internet/core/accounts";',
              'import { accountHasCapability, getAccountDefinition, isAccountId } from "#internet/core/accounts";',
          )
          old = '''function assertAccountRouting(value: unknown): void {
          \tif (!isRecord(value) || !Array.isArray(value.thinkerAccounts)) throw new Error("invalid account routing");
          \tif (
          \t\tvalue.thinkerAccounts.length !== 2 ||
          \t\tvalue.thinkerAccounts[0] !== "chatgpt-thinker" ||
          \t\tvalue.thinkerAccounts[1] !== "gemini-thinker" ||
          \t\tvalue.writerAccount !== "chatgpt-writer" ||
          \t\tvalue.synthesizerAccount !== "chatgpt-thinker"
          \t) {
          \t\tthrow new Error("workflow account routing authority mismatch");
          \t}
          }
          '''
          new = '''function assertAccountRouting(value: unknown): void {
          \tif (!isRecord(value) || !Array.isArray(value.thinkerAccounts)) throw new Error("invalid account routing");
          \tif (value.thinkerAccounts.length !== 2) throw new Error("workflow requires exactly two thinker accounts");
          \tconst [first, second] = value.thinkerAccounts;
          \tif (!isAccountId(first) || !isAccountId(second) || first === second) {
          \t\tthrow new Error("invalid workflow thinker account routing");
          \t}
          \tfor (const accountId of [first, second]) {
          \t\tif (!accountHasCapability(accountId, "team.reason") || !accountHasCapability(accountId, "team.review")) {
          \t\t\tthrow new Error(`workflow thinker account ${accountId} lacks required team capabilities`);
          \t\t}
          \t}
          \tif (value.writerAccount !== "chatgpt-writer") throw new Error("workflow writer authority mismatch");
          \tif (
          \t\t!isAccountId(value.synthesizerAccount) ||
          \t\t!value.thinkerAccounts.includes(value.synthesizerAccount) ||
          \t\t!accountHasCapability(value.synthesizerAccount, "team.synthesize")
          \t) {
          \t\tthrow new Error("invalid workflow synthesizer routing");
          \t}
          }
          '''
          if old not in text:
              raise SystemExit('expected account routing validator was not found')
          store_path.write_text(text.replace(old, new, 1))
          PY
          npx biome check --write src test scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Remove temporary workflow and commit formatted/generated changes
        run: |
          rm .github/workflows/branch-format-build.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test dist .github/workflows/branch-format-build.yml
          git commit -m "build: finalize provider-agnostic team update"
          git push origin HEAD:feat/provider-agnostic-team-status
