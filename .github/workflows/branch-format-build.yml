name: Branch format and build

on:
  push:
    branches:
      - feat/provider-agnostic-team-status

permissions:
  contents: write

jobs:
  format-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-agnostic-team-status
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix known branch-only type annotation and format source/tests
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/workflow-engine.test.ts')
          text = path.read_text()
          old = 'const routing: Array<readonly AccountId[]> = [];'
          new = 'const routing: Array<readonly string[]> = [];'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          npx biome check --write src test scripts
      - run: npm run build
      - name: Remove temporary workflow and commit generated changes
        run: |
          rm .github/workflows/branch-format-build.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test dist .github/workflows/branch-format-build.yml
          if ! git diff --cached --quiet; then
            git commit -m "build: format changes and sync dist"
            git push origin HEAD:feat/provider-agnostic-team-status
          fi
