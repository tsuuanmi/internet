name: P6 finalize

on:
  push:
    branches:
      - impl/p6-scoped-approval-controller

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/p6-finalize.py
      - run: npm ci
      - run: npx biome check --write src test scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify-package
      - name: Commit finalized P6 implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs src test dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor: finalize scoped Website approval boundaries'
          git push
