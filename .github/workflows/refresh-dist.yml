name: Refresh dist for P0 branch

on:
  push:
    branches:
      - impl/p0-chatgpt-high

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit refreshed dist
        shell: bash
        run: |
          if git diff --quiet -- dist; then
            echo 'dist already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git commit -m 'build: refresh dist'
          git push
