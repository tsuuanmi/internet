name: Repair session auth CI

on:
  push:
    branches:
      - fix/session-backed-chatgpt-auth

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Let Biome organize imports before verification
        run: |
          if grep -q 'npx biome format --write' .github/workflows/verify.yml; then
            sed -i 's/npx biome format --write/npx biome check --write/' .github/workflows/verify.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/verify.yml
            git commit -m "ci: allow biome import fixes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
